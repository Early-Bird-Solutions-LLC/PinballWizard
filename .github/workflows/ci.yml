name: CI

# Build, test, and report coverage on every push to main and every PR
# targeting main. Uses locked-mode NuGet restore to enforce that
# packages.lock.json is the source of truth.

# paths-ignore: docs-only / eval-results-only changes don't alter build
# or test outcomes. A fully path-filtered workflow reports NO check at all
# (GitHub does not synthesize a "skipped" run), which would leave the
# required "Build, test, coverage" check stuck in "Expected" — the
# companion ci-docs-noop.yml satisfies it on the inverse path set per
# GitHub's documented workaround. Keep the two path lists in lockstep.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'thoughts/**'
      - 'data/eval/results/**'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'thoughts/**'
      - 'data/eval/results/**'
      - '.claude/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode PinballWizard.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build --no-restore --configuration Release PinballWizard.slnx /warnaserror

      - name: Test (with coverage)
        # Microsoft Code Coverage collector (built into Microsoft.NET.Test.Sdk
        # via Microsoft.CodeCoverage transitive). Cobertura format is the only
        # output our downstream summary action consumes. coverage.runsettings
        # excludes test assemblies and third-party deps so the gate measures
        # production code only — see file header for rationale.
        # Exclude Category=Accessibility, Category=Snapshots, and Category=Circuit
        # — those tests need Playwright browsers installed and run in the ui-tests
        # job. Category=E2E is local-only: it drives the live Azure dev stack with
        # real model calls (tools/e2e/Run-E2E.ps1); the E2EFact attribute also
        # self-skips without the live-stack env.
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --filter "Category!=Accessibility&Category!=Snapshots&Category!=Circuit&Category!=E2E" \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "Code Coverage;Format=cobertura" \
            --settings tests/coverage.runsettings \
            --results-directory ./coverage \
            PinballWizard.slnx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            coverage/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/*/*.cobertura.xml
          if-no-files-found: error
          retention-days: 14

      # Per-assembly coverage policy (docs/quality-spec.md § Coverage policy):
      # Core/Application >= 80%, Api/ServiceDefaults >= 75%, Infrastructure/Web >= 65%.
      # irongut/CodeCoverageSummary enforces only the aggregate floor here.
      # Per-assembly compliance is verified via the coverage table posted on each PR.

      # Threshold gate: fails the job if production-code line coverage drops
      # below the floor. Initial threshold 70% line (current ~73%, rounded
      # down to nearest 5% per quality-spec § Code quality). Ratchet up at
      # phase boundaries when coverage genuinely rises. Runs on both push
      # and PR so main can't drift below the floor between PRs.
      - name: Coverage threshold gate
        if: always()
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage/*/*.cobertura.xml
          badge: true
          fail_below_min: true
          thresholds: '70 80'
          format: markdown
          output: both

      - name: Comment coverage on PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          path: code-coverage-results.md

  ui-tests:
    # Accessibility (axe-core) + responsive snapshots in ONE job: both
    # need the identical setup (restore → Release build → chromium), so
    # running them as separate jobs duplicated a full restore+build+
    # browser-install lane per PR. They run as sequential steps here,
    # still in parallel with build-and-test. Neither check is required
    # by branch protection, so the job rename is safe.
    name: UI tests (axe-core + responsive snapshots, Playwright)
    runs-on: ubuntu-latest
    needs: []

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright browsers
        # Keyed on Directory.Packages.props — invalidates whenever any
        # package version changes, which over-invalidates slightly but
        # never serves a stale browser for a bumped Microsoft.Playwright.
        # On a hit, the install step below skips the ~80 MB download and
        # only re-installs OS deps.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore
        # Web.Tests opts out of locked-mode restore (Razor SDK RID assets).
        run: dotnet restore PinballWizard.slnx

      - name: Build (Release, warnings as errors)
        run: dotnet build --no-restore --configuration Release PinballWizard.slnx /warnaserror

      - name: Install Playwright browsers
        # playwright.ps1 is emitted by the Microsoft.Playwright package into
        # the test project's output directory. pwsh is available on ubuntu-latest.
        # With the browser cache hit above this skips the download and only
        # installs OS dependencies.
        run: |
          pwsh tests/PinballWizard.Web.Tests/bin/Release/net10.0/playwright.ps1 \
            install --with-deps chromium

      - name: Accessibility tests (axe-core, wcag2a + wcag2aa)
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --filter "Category=Accessibility" \
            --logger "trx;LogFileName=a11y-results.trx" \
            --results-directory ./a11y-results \
            tests/PinballWizard.Web.Tests/PinballWizard.Web.Tests.csproj

      - name: Responsive snapshot tests
        # Screenshots are written to ./screenshots/ relative to the working
        # directory. The test asserts no critical WCAG 2.1 violations at each
        # breakpoint; the screenshots themselves are uploaded for manual review —
        # no pixel-diff comparison occurs here. if: always() so a11y failures
        # don't mask layout breakage (and vice versa) — both suites always report.
        if: always()
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --filter "Category=Snapshots" \
            --logger "trx;LogFileName=snapshot-results.trx" \
            --results-directory ./snapshot-results \
            tests/PinballWizard.Web.Tests/PinballWizard.Web.Tests.csproj

      - name: Circuit tests (admin in-process host, no Azure)
        # AdminCircuitSkeletonTests + AdminInteractiveTests (Category=Circuit).
        # These spin up the real Web app in-process via
        # InteractiveAdminWebApplicationFactory and need the static-asset
        # manifest produced by the Release build above — no extra build step
        # needed. if: always() so circuit failures don't mask snapshot failures.
        if: always()
        run: |
          dotnet test \
            --no-build \
            --configuration Release \
            --filter "Category=Circuit" \
            --logger "trx;LogFileName=circuit-results.trx" \
            --results-directory ./circuit-results \
            tests/PinballWizard.Web.Tests/PinballWizard.Web.Tests.csproj

      - name: Upload accessibility test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: a11y-results
          path: a11y-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload snapshot screenshots
        # Always upload — even on test failure the screenshots are useful
        # for diagnosing layout breakage at a given breakpoint.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: responsive-screenshots
          path: screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Upload snapshot test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: snapshot-results
          path: snapshot-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Upload circuit test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: circuit-results
          path: circuit-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14
