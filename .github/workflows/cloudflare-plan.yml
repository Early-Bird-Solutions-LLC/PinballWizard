name: Cloudflare IaC — Plan

# Runs on every PR that touches the Cloudflare IaC. Posts the plan as a
# PR comment for review. Does NOT apply.

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/cloudflare/**'
      - '.github/workflows/cloudflare-plan.yml'

permissions:
  contents: read
  id-token: write    # for Azure OIDC
  pull-requests: write  # to post the plan as a PR comment

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.x

      - name: tofu fmt -check
        run: tofu fmt -check -recursive

      - name: tofu init
        run: tofu init

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        id: plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_zone_id: ${{ secrets.CF_ZONE_ID }}
          TF_VAR_account_id: ${{ secrets.CF_ACCOUNT_ID }}
          TF_VAR_origin_hostname: ${{ vars.ORIGIN_HOSTNAME }}
          TF_VAR_admin_email: ${{ vars.ADMIN_EMAIL }}
          TF_VAR_logpush_destination: ${{ secrets.LOGPUSH_DESTINATION }}
          TF_VAR_aca_domain_verification_token: ${{ secrets.ACA_DOMAIN_VERIFICATION_TOKEN }}
        run: |
          tofu plan -no-color -out=plan.tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload plan artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.pull_request.head.sha }}
          path: infra/cloudflare/plan.tfplan
          retention-days: 14

      - name: Post plan to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = 'infra/cloudflare/plan.txt';
            const plan = fs.existsSync(planPath)
              ? fs.readFileSync(planPath, 'utf8')
              : '⚠️ Plan output not available — the plan step did not produce output (check workflow logs).';
            // Truncate very long plans for the PR comment
            const max = 60000;
            const shown = plan.length > max
              ? plan.slice(0, max) + '\n\n…(truncated, see workflow logs for full plan)'
              : plan;
            const body = `### Cloudflare IaC — Plan\n\n\`\`\`hcl\n${shown}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
