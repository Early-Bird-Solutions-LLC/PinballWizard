# CodeQL static analysis for PinballWizard (C#).
#
# Runs on every push/PR to main and on a weekly schedule so dormant branches
# still get scanned against the latest CodeQL query set. The build step uses
# `--locked-mode` so a tampered or drifted lockfile fails the analysis run.
name: CodeQL

# paths-ignore: docs/eval-results changes can't alter C# analysis
# results. A fully path-filtered workflow reports NO check at all, which
# would leave the required "Analyze (csharp)" check stuck in "Expected" —
# the companion codeql-docs-noop.yml satisfies it on the inverse path set
# per GitHub's documented workaround. Keep the two path lists in lockstep.
# The weekly schedule below still scans everything regardless of paths.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'thoughts/**'
      - 'data/eval/results/**'
      - '.claude/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'thoughts/**'
      - 'data/eval/results/**'
      - '.claude/**'
  schedule:
    # Mondays 06:00 UTC — same cadence as Dependabot so the two land together.
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Restore dependencies (locked)
        run: dotnet restore --locked-mode PinballWizard.slnx

      - name: Build
        run: dotnet build --no-restore --configuration Release PinballWizard.slnx

      # `upload: failure-only` defers the real upload to the filtered step below;
      # per the codeql-action docs it exists exactly "for users post-processing
      # the SARIF file before uploading it to Code Scanning".
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          output: sarif-results
          upload: failure-only

      # paths-ignore in codeql-config.yml does NOT filter results for compiled
      # languages analyzed with a build — the compiler decides what enters the
      # database, so source-generator output under obj/ (RegexGenerator.g.cs)
      # still produces alerts (GitHub docs, "Specifying directories to scan").
      # Stripping those results from the SARIF before upload is GitHub's
      # documented workaround; on the next default-branch run, code scanning
      # auto-closes the existing obj/ alerts as no-longer-detected.
      - name: Filter generated build output from SARIF
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: |
            -**/obj/**
            -**/bin/**
          input: sarif-results/csharp.sarif
          output: sarif-results/csharp.sarif

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: sarif-results/csharp.sarif
