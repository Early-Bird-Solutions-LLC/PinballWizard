name: Docs Agent

# Documentation updater. After each merge to main touching code or infra, reads
# the merged diff and opens an auto-mergeable docs-only PR when a DESCRIPTIVE
# doc has gone untruthful. Weekly sweep catches misses.
#
# This is a CI development-automation agent, NOT a Foundry product agent — it
# acts on git events and edits markdown, so it lives in Actions with
# claude-code-action, not in Foundry. See ADR-0051 for the category boundary.
#
# Trigger shape — two claude-code-action@v1 constraints drive this design:
#   1. It does NOT support the `push` event ("Unsupported event type: push").
#      So the push trigger does not run the agent directly — the `redispatch`
#      job re-invokes this workflow as a workflow_dispatch, which IS supported
#      and (per GitHub docs) always creates a run even from GITHUB_TOKEN, unlike
#      push/pull_request. The agent job runs only on workflow_dispatch/schedule.
#   2. It blocks runs initiated by a non-human actor. The re-dispatched run is
#      initiated by github-actions[bot], so the `Run docs agent` step sets
#      `allowed_bots: "github-actions"` (specific bot, not '*'; see that step).
# Keyless throughout (no PAT).
#
# Auth: GitHub OIDC → Anthropic WIF (ADR-0047), identical to claude.yml. No
# static key. Authority is bounded by .github/docs-agent-allowlist.txt and
# enforced by docs-agent-guard.yml — this is why auto-merge is safe.
#
# No self-retrigger: the agent's PRs edit ONLY allowlisted paths
# (docs/**, README.md, CLAUDE.md, docs/engineering-manifest.json). None of
# those match the push trigger's src/**/infra/**/.github/workflows/** path
# filter, so a merged agent PR cannot retrigger this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infra/**'
      - '.github/workflows/**'
  schedule:
    - cron: '23 8 * * 1'   # Mondays 08:23 UTC — weekly full sweep (low-traffic slot)
  workflow_dispatch:
    inputs:
      before_sha:
        description: 'Base SHA for the diff range (set by the on-push re-dispatch; blank = weekly-style sweep)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  id-token: write
  issues: write       # Report failure step: issues.create / issues.createComment
  # issues:write blast radius: repo issue tracker only; agent Bash tool can also call gh issue create.

concurrency:
  group: docs-agent-main
  cancel-in-progress: false   # each merge deserves its own analysis; queue, don't drop

jobs:
  # claude-code-action rejects `push`, so the push trigger re-dispatches this
  # workflow as a workflow_dispatch (supported; always creates a run even from
  # GITHUB_TOKEN). The push's before-SHA is passed so the agent analyzes the
  # exact merge range. This job does nothing but re-dispatch.
  redispatch:
    name: Re-dispatch merge as workflow_dispatch
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger the agent via workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          gh workflow run docs-agent.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f before_sha="$BEFORE_SHA"

  docs-agent:
    name: Update docs from merged changes
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # need history for the diff range

      - name: Compute diff range
        id: range
        env:
          # before_sha is set by the on-push re-dispatch; empty on a scheduled
          # or manually-triggered sweep. A push never reaches this job.
          BEFORE_SHA: ${{ github.event.inputs.before_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          # An all-zero before-SHA (e.g. branch-create edge) is not a usable
          # base — fall through to the sweep window.
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            # Re-dispatched from an on-push merge: analyze the exact merge range.
            echo "range=$BEFORE_SHA..$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          else
            # sweep/dispatch: last 7 days of commits.
            # Fall back to a bounded window (last 200 commits) if no commit
            # resolves from 7 days ago (e.g. quiet repo, new branch).
            since=$(git rev-list -1 --before='7 days ago' main 2>/dev/null || echo "")
            if [ -z "$since" ]; then
              since=$(git rev-list --max-count=1 --skip=200 main 2>/dev/null || echo "")
            fi
            if [ -n "$since" ]; then
              echo "range=$since..$CURRENT_SHA" >> "$GITHUB_OUTPUT"
            else
              # Repo has fewer than 200 commits — sweep from root
              echo "range=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Run docs agent
        uses: anthropics/claude-code-action@a874e9ecd7bb36efdad65429c6b35815f5a08f10 # v1
        with:
          # #804 root cause (proved by the probe on run 31517799430): the action
          # sends anthropic_api_key as a static x-api-key header, but a WIF
          # access token is only valid as a Bearer token — the API rejected every
          # run before inference ({is_error:true, num_turns:1, cost 0}) while a
          # direct Bearer probe with the SAME token returned HTTP 200. The action
          # has native WIF support: given these ids it performs the GitHub-OIDC
          # exchange itself and authenticates the API call correctly. Requires
          # the id-token: write permission (already granted above).
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # The re-dispatched run is initiated by github-actions[bot] (a Bot,
          # not a human), which claude-code-action blocks by default. Allow
          # ONLY that specific bot — not '*', which the action warns can let
          # external Apps invoke it on public repos (this repo is public). The
          # matcher lowercases + strips the [bot] suffix, so "github-actions"
          # matches the github-actions[bot] actor. Safe here regardless: the
          # prompt is hardcoded below, never taken from the triggering event.
          allowed_bots: "github-actions"
          prompt: |
            You are the PinballWizard docs updater (a CI automation agent — see ADR-0051).
            Analyze the merged change range ${{ steps.range.outputs.range }} (use `git diff` / `git log`).

            Question: does this change make any DESCRIPTIVE documentation untruthful?
            Descriptive docs are factual surfaces: README.md, CLAUDE.md, and docs/** EXCEPT
            docs/adr/** and docs/decision-log.md (those record human decisions — you must
            never author them).

            If NO doc is affected: do nothing, open no PR, exit.

            If docs ARE affected:
              1. Edit ONLY files within .github/docs-agent-allowlist.txt.
              2. Make the minimal truthful correction — do not rewrite, do not editorialize.
              3. If the change looks like it warranted a NEW ADR or decision-log entry,
                 DO NOT write one. Instead note it under a "## Human follow-ups" heading
                 in the PR body.
              4. Create a branch named docs-agent/${{ github.sha }}, commit as
                 Jim Keeley <94459922+jkeeley2073@users.noreply.github.com> (no Claude
                 attribution trailer), push, and open a PR with:
                   - label: claude-code
                   - a body documenting: the analyzed range, each doc touched and WHY,
                     and any Human follow-ups.
              5. Enable auto-merge: `gh pr merge --auto --squash`.
            Never touch code, workflows, ADRs, or the decision log. Keep the diff small.
          claude_args: '--allowedTools "Bash,Edit,Read,Grep,Glob"'

      - name: Report failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const title = 'Docs Agent run failed';
            const body = `The docs-agent workflow failed on ${context.sha} (${context.eventName}). Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'docs-agent-failure' });
            if (existing.data.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['docs-agent-failure'] });
            }
