# Scheduled corpus-coverage probe against the live RAG index.
#
# Proves that every ingested (source × document_type) cell is present and
# retrievable — the coverage guarantee the eval harness (a curated regression
# floor) does not provide. No LLM calls: presence is a facet/count query,
# retrievability is one retrieval per cell. A gap opens/refreshes a pinned issue
# (honest-failure surfacing, invariant #17); a green run closes it.
#
# Triggers:
#   - schedule: daily floor (cron offset off top-of-hour)
#   - workflow_dispatch: on-demand (operator UI — agents often lack Actions write)
#   - workflow_run (Deploy success on main): closes the lag between a Deploy that
#     lands Search/Foundry data-plane RBAC (or image/index changes) and the next
#     daily cron. Without this, a false GAP alarm (#1095 class) stays open until
#     the next 06:41 UTC schedule or a manual dispatch.
#
# Auth: azure/login (OIDC, no long-lived secret), same federated credential as
# deploy.yml. The CLI's SharedAzureCredential resolves against the AI Search
# index; AZURE_TOKEN_CREDENTIALS=dev forces the developer chain (AzureCli, which
# azure/login populates) per the local live-load runbook.
# Requires Search Index Data Reader + Cognitive Services OpenAI User on the
# cicdDeployPrincipalId (shared.bicep) — platform stack apply, or equivalent.

name: Corpus coverage

on:
  schedule:
    - cron: '41 6 * * *' # daily, offset off top-of-hour
  workflow_dispatch: {}
  workflow_run:
    workflows:
      - Deploy
    types:
      - completed

permissions:
  contents: read
  issues: write
  id-token: write   # OIDC token exchange for azure/login
  actions: read     # workflow_run: read triggering Deploy conclusion/branch

concurrency:
  group: corpus-coverage
  cancel-in-progress: false

jobs:
  coverage:
    name: Corpus coverage probe
    # Only follow a successful Deploy on this repo's main. workflow_run always
    # executes in the base-repo default-branch context (OIDC subject is ours),
    # so head_branch alone is not a fork boundary — also require the triggering
    # head repository to be this repository. (Deploy itself is push:main-only
    # today, so the fork path is already unreachable; this keeps the guard
    # honest if Deploy ever gains pull_request triggers.)
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Retrievability uses IRagRetriever → IQueryEmbedder, which requires the
      # Foundry project endpoint (embedding deployment is derived from it).
      # AiSearch alone is not enough — Nov 2026 runs crashed with
      # InvalidOperationException and uploaded stale committed coverage.*.json
      # as the "report" (#749).
      - name: Run corpus-coverage probe
        env:
          AiSearch__Endpoint: https://pinwiz-search-dev-buutj.search.windows.net
          AiFoundry__ProjectEndpoint: https://pinwiz-foundry-dev-buutj.services.ai.azure.com/api/projects/pinwiz-wizard
          AiSearch__EmbeddingDeploymentName: text-embedding-3-large
          AZURE_TOKEN_CREDENTIALS: dev
        run: |
          # Isolate this run's report from any committed historical coverage.*.json
          # so the artifact is unambiguous.
          rm -f data/eval/results/coverage.*.json
          dotnet run --project src/PinballWizard.Cli --configuration Release -- --corpus-coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: data/eval/results/coverage.*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Raise the alarm
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Corpus coverage GAP against the deployed index"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still gapping. $body"
          else
            alarm_body=$(printf 'The daily corpus-coverage probe found a gap: a (source × document_type) cell is not retrievable, or an expected source has zero indexed chunks. %s\n\nTriage: download the coverage-report artifact; each gap names the source + document_type. Closes automatically when a run goes green.' "$body")
            gh issue create --title "$title" --label bug --body "$alarm_body"
          fi

      - name: Close the alarm on green
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Corpus coverage GAP against the deployed index"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Coverage is back to full. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$existing"
          fi
