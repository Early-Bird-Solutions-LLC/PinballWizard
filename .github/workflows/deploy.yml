name: Deploy

# Builds and pushes container images to ACR, then updates the ACA apps and
# ACA Jobs when source code changes land on main. Separated from ci.yml so a
# failed deploy does not block test-coverage reporting, and so the deploy
# can be re-triggered independently.
#
# Authentication: GitHub OIDC federated credentials (no long-lived secrets).
# Required one-time operator setup in Entra before this workflow can run:
#   1. Create an app registration in the Earlybird Entra tenant.
#   2. Add a federated credential for:
#        Issuer:  https://token.actions.githubusercontent.com
#        Subject: repo:Early-Bird-Solutions-LLC/PinballWizard:ref:refs/heads/main
#        Audience: api://AzureADTokenExchange
#   3. Grant the app registration these Azure RBAC roles:
#        AcrPush  on  <acr-resource>   (push + az acr login token exchange)
#        Owner    on  <subscription>   (required for az stack sub create — manages
#                                       subscription-scoped deploymentStack resources
#                                       and creates the role assignments the Bicep
#                                       template controls). The per-app Contributor
#                                       grants in infra/modules/shared.bicep are
#                                       still IaC-managed via cicdDeployPrincipalId
#                                       (set in main-shared.dev.bicepparam), but the
#                                       stack run itself requires subscription Owner
#                                       because `az stack sub create` operates at
#                                       subscription scope and the template creates
#                                       sqlRoleAssignments / Storage / KV RBAC that
#                                       require Microsoft.Authorization/*/write.
#                                       ⚠️ Standard Contributor is NOT enough.
#   4. Add these GitHub repository secrets:
#        AZURE_CLIENT_ID       — app registration client ID (appId)
#        AZURE_TENANT_ID       — 9793cd0f-2b27-4757-9986-1f7f1e35864a
#        AZURE_SUBSCRIPTION_ID — b1f33f17-74a9-4ecc-b46c-c4f31776b840
#        DEVELOPER_OBJECT_ID   — Entra Object ID of the human developer (not the
#                                SP). Passed to the stack run so the developer's
#                                data-plane RBAC assignments (Cosmos Data
#                                Contributor, Search Index Data Contributor,
#                                Cognitive Services OpenAI User) are preserved.
#                                Without this, every CI stack run strips those
#                                roles and local-live CLI runs fail with 403.
#                                Find it: az ad signed-in-user show --query id
#   5. Add these GitHub repository variables (Settings → Variables → Actions):
#        ACR_LOGIN_SERVER      — <acr-name>.azurecr.io  (full login server)
#        ACA_RESOURCE_GROUP    — rg-pinwiz-shared-dev
#        WIZARD_APP_NAME       — pinwiz-ca-wizard-dev
#        API_APP_NAME          — pinwiz-ca-api-dev
#        RAGINDEXER_APP_NAME   — pinwiz-ca-ragindexer-dev
#
# Build approach: docker buildx build --push (runner-side build).
# This only requires AcrPush (data-plane) on the ACR — no control-plane
# access needed. az acr build (cloud build) was dropped because it requires
# Microsoft.ContainerRegistry/registries/runs/write which has no least-
# privilege built-in role. Runner-side builds use GitHub compute and add
# GHA cache layer caching (cache-from/cache-to: type=gha).
#
# Image tagging policy (locked invariant — CLAUDE.md #16):
#   - Every build pushes :{sha} tag (explicit, immutable reference).
#   - :latest is also pushed as a convenience alias for `docker pull`.
#   - ACA container configuration ALWAYS uses :{sha} — never :latest.

on:
  push:
    branches: [main]
    paths:
      - 'src/PinballWizard.Web/**'
      - 'src/PinballWizard.Web.Client/**'
      - 'src/PinballWizard.Api/**'
      - 'src/PinballWizard.RagIngestionWorker/**'
      - 'src/PinballWizard.Cli/**'
      - 'src/PinballWizard.Application/**'
      - 'src/PinballWizard.Infrastructure/**'
      - 'src/PinballWizard.Core/**'
      - 'src/PinballWizard.ServiceDefaults/**'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      # infra/** matters because detect-changes gates the deployment stack on it.
      # Without it an infra-only change never triggers this workflow at all, so the
      # ^infra/ branch of that gate was unreachable and Bicep edits reached production
      # only via a manual stack run — the gap #859 exists to close.
      - 'infra/**'
      # deploy/** holds scheduled-cli-job.bicep, the module every one of the 20 ACA
      # Jobs is built from. Omitting it meant a change to the job definitions could
      # merge and never deploy — the same inert-change defect as #859, one directory
      # over. Found when #875 merged and triggered nothing.
      - 'deploy/**'
      - 'docs/**'

  # Allow manual trigger from the Actions tab (useful for re-deploying
  # without a code change, e.g. after an infra-only deploy reverts the image).
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC token exchange with Azure
  actions: read     # detect-changes reads workflow run history to find the last
                    # successfully-deployed SHA rather than github.event.before (#910)

concurrency:
  # One deploy at a time on main; a new push cancels an in-progress one.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Fast pre-flight: detect which logical path categories changed. Runs in
  # parallel with build-deploy so it adds no wall-clock to the critical path.
  #
  # The `deploy-jobs` stack run is gated on `run_stack == 'true'` specifically
  # to avoid triggering the Azure CognitiveServices Real-Time Fraud Protection
  # (RTFP) system (error 715-123420) on every merge. The stack includes Foundry
  # model deployments; repeated rapid cycles (>~3–5/day) trigger a service-side
  # block that requires waiting or Microsoft Support. The ARM Deployment Stack
  # itself has no documented per-day limit (confirmed against Microsoft Learn
  # 2026-08-13: https://learn.microsoft.com/en-us/azure/azure-resource-manager/
  # bicep/deployment-stacks-known-issues). Gating on CLI/infra changes avoids
  # unnecessary stack runs when only web/api/rag-indexer code changed.
  detect-changes:
    name: Detect CLI / infra changes
    runs-on: ubuntu-latest
    outputs:
      run_stack: ${{ steps.detect.outputs.run_stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Full history: the comparison base is now the HEAD SHA of the last
          # successful deployment stack run, which may be many commits behind HEAD
          # (e.g. after a chain of docs-only or cancelled pushes). The old
          # fetch-depth:2 only reached one commit back (github.event.before); the
          # new baseline can be arbitrarily older. See #910.
          fetch-depth: 0

      - name: Check for CLI or infra changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_dispatch: always run the stack (operator intent).
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_stack=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — unconditionally running the deployment stack."
            exit 0
          fi

          # ── Find the real deployment base (#910) ────────────────────────────
          # BUG: the old approach diffed HEAD against github.event.before (the SHA
          # of the immediately prior push to main). That is wrong when a prior deploy
          # run was cancelled mid-flight: if push N added infra changes but its deploy
          # run was cancelled by push N+1 arriving before it finished, N+1's
          # detect-changes diffed N+1 against N. If N+1 only touched docs, run_stack
          # came out false — even though N's infra changes were never applied anywhere.
          # The failure was silent: no failed step, no red X, just a legitimately-green
          # "no infra changes" skip computed against the wrong comparison base.
          # Confirmed live: #907's Playwright Workspace resource never appeared in Azure
          # because #908 (a docs-only bot PR) cancelled and then superseded #907's deploy
          # run. The stack's lastModified predated #907's merge entirely.
          #
          # Fix: diff against the HEAD SHA of the most recent deploy.yml run on main
          # where the deploy-jobs job actually completed with conclusion=success —
          # meaning the deployment stack was applied and infra is known-current at that
          # commit. A run where deploy-jobs was *skipped* (run_stack=false on that run)
          # is not a valid baseline: the deployed state is unchanged from whatever ran
          # before it. A cancelled or failed overall run is also not valid. This extends
          # the "fail toward run_stack=true" posture already established for the zero-SHA
          # and shallow-clone cases: when genuinely uncertain about the baseline, run the
          # stack rather than risk a silent skip (invariant #17, #859, #910).

          BASE_SHA=""

          # Keep stdout and stderr separate: gh writes deprecation/auth warnings to
          # stderr even on success, and folding them in with 2>&1 would corrupt the
          # JSON, making the jq parse below fail and silently forcing the bootstrap
          # path (run_stack=true) on every push — the same misfire as the bug this
          # step exists to fix.
          GH_LIST_ERR=$(mktemp)
          if ! GH_RUNS=$(gh run list \
                --workflow=deploy.yml \
                --branch=main \
                --status=completed \
                --json databaseId,headSha \
                --limit=50 2>"$GH_LIST_ERR"); then
            echo "::warning::gh run list failed — cannot determine last-deployed SHA (#910)."
            echo "::warning::Stderr: $(cat "$GH_LIST_ERR")"
            rm -f "$GH_LIST_ERR"
            echo "::warning::Running the deployment stack rather than risking a silent skip."
            echo "run_stack=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rm -f "$GH_LIST_ERR"

          # Walk recent successful workflow runs and find the first one where the
          # deployment stack job itself reached conclusion=success (not just skipped).
          # The overall workflow can succeed even when deploy-jobs was *skipped*
          # (run_stack=false on that run), so a job-level check is necessary.
          #
          # jq note: parentheses around `.databaseId | tostring` are required — `|` is
          # the lowest-precedence jq operator, so without them `[.databaseId | tostring,
          # .headSha]` parses as `[.databaseId | (tostring, .headSha)]`, applying
          # `.headSha` to a number rather than to the run object → jq error → zero rows
          # → loop never executes → BASE_SHA always empty (boot-strap on every push).
          _gh_view_fails=0
          _job_missing_warned=0
          while IFS=$'\t' read -r run_id head_sha; do
            GH_VIEW_ERR=$(mktemp)
            if ! JOBS_JSON=$(gh run view "$run_id" --json jobs \
                              2>"$GH_VIEW_ERR" </dev/null); then
              _gh_view_fails=$((_gh_view_fails + 1))
              rm -f "$GH_VIEW_ERR"
              continue
            fi
            rm -f "$GH_VIEW_ERR"

            # NOTE: the job name below must stay in sync with the deploy-jobs job's
            # `name:` field. If that field is ever renamed, select() returns nothing
            # (conclusion=""), not "skipped". The loop then exhausts all 50 runs,
            # BASE_SHA stays empty, and every push takes the bootstrap path
            # (run_stack=true) — which risks the 715-123420 RTFP throttle documented
            # at lines 108-116 above. An empty conclusion here means either a rename
            # or an unexpectedly old run structure; warn once so it surfaces.
            deploy_conclusion=$(printf '%s' "$JOBS_JSON" | jq -r \
              '.jobs[] | select(.name == "Repoint ACA jobs via deployment stack") | .conclusion // empty')
            if [ "$deploy_conclusion" = "success" ]; then
              BASE_SHA="$head_sha"
              echo "Last successful deployment stack run: #$run_id at $head_sha"
              break
            elif [ -z "$deploy_conclusion" ] && [ "$_job_missing_warned" = "0" ]; then
              echo "::warning::deploy-jobs job ('Repoint ACA jobs via deployment stack') not found in"
              echo "::warning::run #$run_id. If it was renamed, this lookup will always exhaust all runs"
              echo "::warning::and fall back to run_stack=true (RTFP risk — see lines 108-116)."
              _job_missing_warned=1
            fi
          done < <(printf '%s' "$GH_RUNS" | \
                   jq -r '.[] | [(.databaseId | tostring), .headSha] | @tsv')

          if [ "$_gh_view_fails" -gt 0 ]; then
            echo "::warning::$_gh_view_fails gh run view call(s) failed (token scope, API 5xx, or rate limit)."
            echo "::warning::Those runs were skipped; result may be based on fewer than 50 candidates."
          fi

          if [ -z "$BASE_SHA" ]; then
            # Bootstrap: no prior run has deploy-jobs=success (first deploy ever,
            # or every recent run was cancelled/failed before the stack completed,
            # or all gh run view calls failed). Use ::warning:: so this appears in
            # GHA annotations, not buried in the step log — invariant #17
            # ("fallbacks must not hide failures"), the posture this step cites
            # throughout.
            echo "::warning::No prior successful deployment stack run found in the last 50 runs."
            echo "::warning::Treating as first deployment — running the stack."
            echo "run_stack=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Comparing HEAD (${GITHUB_SHA}) against last-deployed $BASE_SHA."

          # ── Resolve the diff ────────────────────────────────────────────────
          # fetch-depth:0 above ensures BASE_SHA is present in the clone. The
          # git cat-file check is kept as a belt-and-suspenders guard against edge
          # cases (e.g. a force-pushed history, an unexpectedly missing object).
          # On any failure, fall toward run_stack=true — matching the existing
          # hardening pattern that the zero-SHA and shallow-clone cases already use,
          # and honouring "fallbacks must not hide failures" (invariant #17).
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "run_stack=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Base commit $BASE_SHA not reachable despite fetch-depth:0 (unexpected)."
            echo "::warning::Running the deployment stack rather than skipping it."
            exit 0
          fi

          DIFF_ERR=$(mktemp)
          if ! CHANGED=$(git diff --name-only "$BASE_SHA" HEAD 2>"$DIFF_ERR"); then
            echo "run_stack=true" >> "$GITHUB_OUTPUT"
            echo "::warning::git diff against $BASE_SHA failed:"
            sed 's/^/::warning::  /' "$DIFF_ERR"
            rm -f "$DIFF_ERR"
            echo "::warning::Running the deployment stack rather than skipping it."
            exit 0
          fi
          rm -f "$DIFF_ERR"

          if printf '%s\n' "$CHANGED" | grep -qE \
            '^(src/PinballWizard\.(Cli|Application|Infrastructure|Core|ServiceDefaults)/|Directory\.(Build|Packages)\.props|infra/|deploy/)'; then
            echo "run_stack=true" >> "$GITHUB_OUTPUT"
            echo "CLI or infra paths changed since $BASE_SHA — deployment stack will run."
          else
            echo "run_stack=false" >> "$GITHUB_OUTPUT"
            echo "No CLI or infra changes since last successful stack deployment ($BASE_SHA) — skipping."
          fi

  build-deploy:
    # Web and Api images build + deploy in parallel matrix legs — they
    # share no build outputs (independent Dockerfiles over the same
    # context), so serializing them only added wall-clock. Per-image GHA
    # cache scopes keep the two legs from thrashing each other's layer
    # cache (the default shared scope would race under mode=max).
    name: Build + deploy ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pinwiz-web
            dockerfile: src/PinballWizard.Web/Dockerfile
            app_name_var: WIZARD_APP_NAME
          - image: pinwiz-api
            dockerfile: src/PinballWizard.Api/Dockerfile
            app_name_var: API_APP_NAME
          # RAG ingestion worker (Change-Feed → embed → AI Search). No HTTP
          # surface, so no smoke/e2e probe — it just builds + swaps the image.
          # Closes the W3-2 gap where the worker shipped a Dockerfile but the
          # pipeline never built it, leaving the live app on the quickstart
          # placeholder (the real worker code never ran). Scale floor stays
          # min=0 in Bicep, so first activation is near-zero runtime risk.
          - image: pinwiz-rag-indexer
            dockerfile: src/PinballWizard.RagIngestionWorker/Dockerfile
            app_name_var: RAGINDEXER_APP_NAME
          # CLI image — feeds all 20 ACA *Jobs* (scraper / linker / OPDB sync
          # cron jobs), NOT an ACA *App*. This leg is build + push only; the
          # `deploy-jobs` job below then triggers an `az stack sub create` with
          # the new :{sha} CLI tag, which repoints all 20 jobs atomically via
          # Bicep (every job uses the `cliImageTag` parameter). Using the stack
          # is the only path that satisfies the Deployment Stacks LOCKED
          # INVARIANT (CLAUDE.md #16, DLV-02) — `az containerapp job update` is
          # explicitly banned. The empty app_name_var disables the `az
          # containerapp update` step that serves ACA *App* legs only.
          - image: pinwiz-cli
            dockerfile: src/PinballWizard.Cli/Dockerfile
            app_name_var: ''

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ── Azure login via OIDC (no long-lived secret) ────────────────────────
      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Docker login to ACR ───────────────────────────────────────────────
      - name: Login to ACR
        run: az acr login --name ${{ vars.ACR_LOGIN_SERVER }}

      # ── Docker Buildx setup ───────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # ── Compute build timestamp ───────────────────────────────────────────
      # All matrix legs compute this; only the web Dockerfile promotes the value
      # to an ENV var (ARG BUILD_TIME → ENV PINWIZ_BUILD_TIME). Non-web images
      # declare ARG BUILD_TIME but do not promote it, so the value is silently
      # discarded. Step output is used (not GITHUB_ENV) so the reference is
      # statically valid to YAML linters.
      - name: Compute build timestamp
        id: build_meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      # ── Build + push image ────────────────────────────────────────────────
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}

      # ── Deploy to ACA ─────────────────────────────────────────────────────
      # Always use the explicit :{sha} tag — never :latest (locked invariant).
      # Skipped for job-only images (app_name_var == ''), e.g. pinwiz-cli, which
      # feed ACA Jobs swapped via the Deployment Stack rather than app revisions.
      - name: Update ACA image
        if: ${{ matrix.app_name_var != '' }}
        run: |
          az containerapp update \
            --name ${{ vars[matrix.app_name_var] }} \
            --resource-group ${{ vars.ACA_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}

  # ────────────────────────────────────────────────────────────────────────────
  # Run a Deployment Stack update with the freshly built CLI SHA so all 20 ACA
  # Jobs are repointed in one IaC-governed, idempotent operation. This closes
  # the gap where `pinwiz-cli` images merged to main but jobs ran a 26-day-old
  # build until an operator manually re-ran Deploy-SharedResources.ps1 (#859).
  #
  # Using `az stack sub create` is the ONLY correct path (locked invariant
  # DLV-02 / CLAUDE.md #16). `az containerapp job update --image` is banned.
  #
  # Only runs when CLI or infra files changed (gated by detect-changes). Skips
  # if the build-deploy matrix failed — never push a non-existent image tag.
  #
  # RBAC PREREQUISITE (one-time operator setup, not yet applied):
  #   Grant the OIDC SP Owner at subscription scope so it can create the
  #   subscription-scoped deploymentStack resource and manage the RBAC
  #   assignments the Bicep template controls (sqlRoleAssignments, KV, Storage,
  #   AI Search, per-app Contributor). Standard Contributor is not sufficient
  #   because it lacks Microsoft.Authorization/roleAssignments/write.
  #
  #   az role assignment create \
  #     --role Owner \
  #     --assignee c8466e83-9470-4cad-92a1-2d4149263fdc \
  #     --scope /subscriptions/b1f33f17-74a9-4ecc-b46c-c4f31776b840
  #
  #   Until this grant is applied, this job will fail on first run.
  #
  deploy-jobs:
    name: Repoint ACA jobs via deployment stack
    runs-on: ubuntu-latest
    # Declared explicitly even though the top-level permissions block already grants
    # both. It is redundant today, but `smoke` and `report` already set their own, and
    # a job that authenticates to Azure via OIDC should state the token requirement at
    # the point of use — if some later job adds a narrower override, this one keeps
    # working rather than failing at azure/login with an unobvious cause.
    permissions:
      contents: read
      id-token: write
    needs: [build-deploy, detect-changes]
    # Skip when: (a) build-deploy failed (avoids pushing a non-existent SHA to
    # jobs), or (b) detect-changes determined no CLI/infra paths changed.
    # Default GHA behavior: job is SKIPPED (not failed) when needs.*.result !=
    # 'success', which is correct — a skip does NOT trigger the report failure
    # alarm. We deliberately omit !cancelled() here so a build failure also
    # prevents the stack run.
    if: ${{ needs.detect-changes.outputs.run_stack == 'true' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # ── Azure login via OIDC ────────────────────────────────────────────────
      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Preserve currently-deployed app images ──────────────────────────────
      # Auto-discover the running wizard / api / ragindexer image tags so a
      # CLI-only stack run does not revert those apps to the quickstart
      # placeholder. Mirrors Deploy-SharedResources.ps1 lines 325-353. At this
      # point build-deploy has already completed, so the apps are on the new SHA
      # (or the previous SHA if those legs failed — either way, we preserve what
      # is actually running rather than blindly assuming the new SHA).
      - name: Discover current app image tags
        id: imgs
        run: |
          RG="${{ vars.ACA_RESOURCE_GROUP }}"

          # These values are passed straight into the stack run, which REWRITES the three
          # live apps. So a lookup failure must abort, never substitute.
          #
          # This previously fell back to mcr.microsoft.com/k8se/quickstart:latest whenever
          # the lookup returned empty — and because `az` was run with `2>/dev/null || true`,
          # a transient auth blip or throttle was indistinguishable from "no app". The stack
          # would then apply the Microsoft quickstart placeholder to wizard, api and
          # ragindexer: a self-inflicted production outage, executed unattended, on a run
          # that reported success. That is precisely the "fabricated success" invariant #17
          # forbids — a fallback presenting a synthetic value as though it were real state.
          #
          # Fail loudly instead. The apps are already on the new SHA by this point (build-deploy
          # completed), so aborting here costs only the job repoint, which the next run redoes.
          # stderr goes to its own file, never merged into stdout with 2>&1. az writes
          # deprecation and extension warnings to stderr even on SUCCESS, and merging
          # them would splice that text into the image tag — which is then handed to the
          # stack and written onto the live app. That is the same defect as the
          # placeholder fallback this function replaced, just arriving by a different
          # route, so the capture has to keep the streams apart.
          discover_image() {
            local app="$1" out err rc
            err=$(mktemp)
            out=$(az containerapp show -n "$app" -g "$RG" \
                  --query 'properties.template.containers[0].image' -o tsv 2>"$err")
            rc=$?
            # Diagnostics go to STDERR (>&2), never stdout. This function is called as
            # WIZARD=$(discover_image ...), so anything written to stdout is captured into
            # the variable instead of printed — the loud failure would have been silently
            # swallowed by the very command substitution meant to read its result, leaving
            # an operator with a bare non-zero exit and no reason. Only the image tag
            # itself belongs on stdout.
            if [ "$rc" -ne 0 ]; then
              echo "::error::Could not read the current image for '$app': $(tr '\n' ' ' < "$err")" >&2
              echo "::error::Refusing to run the deployment stack — passing a guessed image here" >&2
              echo "::error::would rewrite the live app with it." >&2
              rm -f "$err"
              return 1
            fi
            rm -f "$err"
            if [ -z "$out" ]; then
              echo "::error::Current image for '$app' came back empty. Refusing to run the" >&2
              echo "::error::deployment stack rather than substitute a placeholder." >&2
              return 1
            fi
            printf '%s' "$out"
          }

          WIZARD=$(discover_image "${{ vars.WIZARD_APP_NAME }}") || exit 1
          API=$(discover_image "${{ vars.API_APP_NAME }}") || exit 1
          RAGINDEXER=$(discover_image "${{ vars.RAGINDEXER_APP_NAME }}") || exit 1

          echo "wizard=$WIZARD"     >> "$GITHUB_OUTPUT"
          echo "api=$API"           >> "$GITHUB_OUTPUT"
          echo "ragindexer=$RAGINDEXER" >> "$GITHUB_OUTPUT"

          echo "  wizardImageTag:     $WIZARD"
          echo "  apiImageTag:        $API"
          echo "  ragIndexerImageTag: $RAGINDEXER"
          echo "  cliImageTag:        ${{ vars.ACR_LOGIN_SERVER }}/pinwiz-cli:${{ github.sha }}"

      # ── Deployment Stack update ─────────────────────────────────────────────
      # Passes the committed bicepparam file (picks up cicdDeployPrincipalId,
      # azureAdClientId, deployPhase2, searchLocation, etc.) and overrides:
      #   - *ImageTag params with the auto-discovered / just-built values
      #   - developerObjectId from the DEVELOPER_OBJECT_ID secret so the stack
      #     preserves the human developer's data-plane role assignments. Without
      #     this override the bicepparam's empty string causes deleteResources to
      #     strip those assignments on every CI run (#744).
      #
      # Stack name convention: "pinwiz-shared-{env}" — matches Deploy-SharedResources.ps1.
      # Location: eastus2 — matches the subscription-scope stack registration.
      # action-on-unmanage deleteResources — Bicep-removed resources are cleaned up.
      # Fail BEFORE the stack runs if DEVELOPER_OBJECT_ID is unset. Without this the
      # step would pass developerObjectId="" straight through, and combined with
      # --action-on-unmanage deleteResources that STRIPS the developer's Cosmos /
      # Search / OpenAI data-plane role assignments (#744) — silently, on a run that
      # otherwise looks successful. Restoring them is manual.
      #
      # Today the missing subscription-scope Owner grant masks this, because the stack
      # call fails at authorization first. That is accidental protection, not a design:
      # granting Owner without also adding the secret would expose it immediately. This
      # guard makes the ordering explicit instead of relying on one gap covering another.
      - name: Verify DEVELOPER_OBJECT_ID is configured
        run: |
          if [ -z "${{ secrets.DEVELOPER_OBJECT_ID }}" ]; then
            echo "::error::DEVELOPER_OBJECT_ID secret is not set. Refusing to run the deployment"
            echo "::error::stack: an empty developerObjectId would strip developer data-plane"
            echo "::error::RBAC (Cosmos / Search / OpenAI) via --action-on-unmanage deleteResources (#744)."
            echo "::error::Add the secret with the developer's Entra Object ID, then re-run."
            exit 1
          fi
          echo "DEVELOPER_OBJECT_ID is set."

      # Preflight the stack with the SAME arguments before mutating anything.
      # `az stack sub validate` exercises the real path — authorization, template
      # compilation, and the .bicepparam-plus-inline-override parameter syntax — without
      # deploying, so a missing RBAC grant surfaces here with remediation attached rather
      # than as a raw AuthorizationFailed part-way through an unattended
      # --action-on-unmanage deleteResources run.
      #
      # This is deliberately a capability probe, not a role-name lookup: checking for
      # "Owner" would assert a proxy for the permission instead of the permission itself,
      # and would pass or fail for reasons unrelated to whether the operation can actually
      # run. Validate answers the only question that matters.
      #
      # KNOWN: as of this commit the OIDC service principal has NO subscription-scope role
      # assignment, so this step is expected to fail until the grant below is applied. That
      # is why it fails loudly with instructions rather than letting the create attempt it.
      - name: Preflight the deployment stack (validate only)
        run: |
          # Captured rather than streamed, so the failure can be CLASSIFIED below instead
          # of the operator having to interpret it. Echoed back on failure so nothing is
          # hidden by the capture.
          VALIDATE_OUT=$(mktemp)
          if ! az stack sub validate \
            --name "pinwiz-shared-dev" \
            --location eastus2 \
            --template-file infra/main-shared.bicep \
            --parameters infra/main-shared.dev.bicepparam \
              wizardImageTag="${{ steps.imgs.outputs.wizard }}" \
              apiImageTag="${{ steps.imgs.outputs.api }}" \
              ragIndexerImageTag="${{ steps.imgs.outputs.ragindexer }}" \
              cliImageTag="${{ vars.ACR_LOGIN_SERVER }}/pinwiz-cli:${{ github.sha }}" \
              developerObjectId="${{ secrets.DEVELOPER_OBJECT_ID }}" \
            --action-on-unmanage deleteResources \
            --deny-settings-mode none > "$VALIDATE_OUT" 2>&1; then
            cat "$VALIDATE_OUT"
            echo "::error::Deployment stack validation failed — NOT running the stack."
            echo "::error::"

            # 715-123420 is the CognitiveServices RTFP throttle, and it arrives disguised
            # as a Microsoft.CognitiveServices/accounts PREFLIGHT VALIDATION error. Without
            # this branch the RBAC text below sends the reader to check permissions that are
            # perfectly intact, while the real cause is that the stack has already run
            # ~3-5 times today. Retrying extends the block rather than clearing it.
            # Classify it once here so every future occurrence is not re-diagnosed from
            # scratch — this has already cost a debugging session before.
            if grep -q "715-123420" "$VALIDATE_OUT"; then
              echo "::error::THROTTLE, NOT A FAILURE: Azure returned 715-123420"
              echo "::error::(CognitiveServices RTFP). The stack template includes Foundry model"
              echo "::error::deployments, and roughly 3-5 stack runs per day trips a service-side"
              echo "::error::block that presents itself as a validation error."
              echo "::error::"
              echo "::error::WAIT — do NOT retry. Retrying extends the block. RBAC is NOT the"
              echo "::error::problem here and re-granting roles will not help."
              echo "::error::"
              echo "::error::The container images ARE built and pushed to ACR; only the ACA job"
              echo "::error::repoint is deferred. The next successful stack run picks them up."
              exit 1
            fi

            echo "::error::If this is an authorization failure, the GitHub OIDC service"
            echo "::error::principal needs Owner at subscription scope. az stack sub create"
            echo "::error::operates at subscription scope and the template writes role"
            echo "::error::assignments, which require Microsoft.Authorization/*/write —"
            echo "::error::Contributor is NOT sufficient:"
            echo "::error::"
            echo "::error::  az role assignment create --role Owner \\"
            echo "::error::    --assignee c8466e83-9470-4cad-92a1-2d4149263fdc \\"
            echo "::error::    --scope /subscriptions/b1f33f17-74a9-4ecc-b46c-c4f31776b840"
            echo "::error::"
            echo "::error::Otherwise it is a template or parameter error — see the output above."
            exit 1
          fi
          echo "Stack validation passed — proceeding to the live run."

      - name: Run deployment stack (repoints 20 ACA jobs to pinwiz-cli:${{ github.sha }})
        run: |
          az stack sub create \
            --name "pinwiz-shared-dev" \
            --location eastus2 \
            --template-file infra/main-shared.bicep \
            --parameters infra/main-shared.dev.bicepparam \
              wizardImageTag="${{ steps.imgs.outputs.wizard }}" \
              apiImageTag="${{ steps.imgs.outputs.api }}" \
              ragIndexerImageTag="${{ steps.imgs.outputs.ragindexer }}" \
              cliImageTag="${{ vars.ACR_LOGIN_SERVER }}/pinwiz-cli:${{ github.sha }}" \
              developerObjectId="${{ secrets.DEVELOPER_OBJECT_ID }}" \
            --action-on-unmanage deleteResources \
            --deny-settings-mode none \
            --yes

      # A green stack run is not evidence the 20 jobs actually moved. #859 exists
      # precisely because images stayed stale while everything reported success, so
      # this asserts the acceptance criterion rather than assuming it: every
      # pinwiz-job-* container must now reference the SHA just built. Without it,
      # deploy-jobs proves only that the ARM call returned 200 — the same
      # green-but-unverified shape the issue is about.
      - name: Verify all ACA jobs now run the built image
        run: |
          EXPECTED="${{ vars.ACR_LOGIN_SERVER }}/pinwiz-cli:${{ github.sha }}"
          RG="${{ vars.ACA_RESOURCE_GROUP }}"

          ERRF=$(mktemp)
          if ! ACTUAL=$(az containerapp job list -g "$RG" \
               --query "[?starts_with(name,'pinwiz-job-')].{name:name,image:properties.template.containers[0].image}" \
               -o tsv 2>"$ERRF"); then
            echo "::error::Could not list ACA jobs to verify the repoint:"
            sed 's/^/::error::  /' "$ERRF"
            rm -f "$ERRF"
            exit 1
          fi
          rm -f "$ERRF"

          # An empty list must fail, not pass. A query that silently matches nothing
          # would otherwise report success for zero jobs — a false green of exactly
          # the kind this step exists to prevent.
          if [ -z "$ACTUAL" ]; then
            echo "::error::No pinwiz-job-* jobs found in $RG. Expected 20 — refusing to"
            echo "::error::report a successful repoint against an empty result."
            exit 1
          fi

          STALE=$(printf '%s\n' "$ACTUAL" | grep -v -F "$EXPECTED" || true)
          TOTAL=$(printf '%s\n' "$ACTUAL" | grep -c . || true)
          if [ -n "$STALE" ]; then
            echo "::error::These ACA jobs are NOT on $EXPECTED after the stack run:"
            printf '%s\n' "$STALE" | sed 's/^/::error::  /'
            exit 1
          fi
          echo "All $TOTAL pinwiz-job-* jobs are on $EXPECTED."

  smoke:
    # Runs after the build-deploy matrix completes — the wizard app depends on
    # the Api app for answers, so probing before both are updated would pass
    # against a mixed-version pair.
    #
    # Also waits on deploy-jobs. The stack run re-applies the whole subscription
    # template, which can churn app revisions while smoke is probing — a race that
    # yields an arbitrary pass or fail rather than a verdict about the deployment.
    # `!cancelled()` is what keeps this from becoming a new gate: smoke still runs
    # when deploy-jobs is SKIPPED (the common web-only merge) or FAILS, so a stack
    # problem never suppresses the app verification that would reveal its impact.
    #
    # `if: !cancelled()` overrides the default GHA behavior where any failed
    # matrix leg causes downstream jobs to be SKIPPED. Without it, a failure in
    # an unrelated leg (e.g., pinwiz-rag-indexer RBAC, pinwiz-cli linker) silently
    # disables the only gate that catches landing-circuit regressions — which is
    # exactly how the PR #401 outage shipped "green". The smoke probe itself
    # queries the wizard /alive endpoint, so if the wizard leg genuinely failed,
    # smoke will fail correctly; if only an unrelated leg failed, smoke runs and
    # validates the wizard surface as intended.
    name: Smoke test /alive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-deploy, deploy-jobs]
    if: ${{ !cancelled() }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure login
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Wait for the new revision to be healthy, then probe /alive.
      # ACA revision rollover takes ~30–60 s; 120 s timeout is generous.
      - name: Smoke test /alive
        id: probe
        run: |
          FQDN=$(az containerapp show \
            --name ${{ vars.WIZARD_APP_NAME }} \
            --resource-group ${{ vars.ACA_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=${FQDN}" >> "$GITHUB_OUTPUT"

          echo "Probing https://${FQDN}/alive ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FQDN}/alive" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ /alive returned 200 after ${i} attempts"
              exit 0
            fi
            echo "  attempt ${i}/12 — got ${STATUS}, retrying in 10s..."
            sleep 10
          done
          echo "❌ /alive did not return 200 after 120 s"
          exit 1

    outputs:
      wizard_fqdn: ${{ steps.probe.outputs.fqdn }}

  e2e:
    # Post-deploy functional canary: real browser through the deployed
    # wizard app's own FQDN (no Cloudflare in this path) — circuit
    # interactivity, seed-question hand-off with auto-submit, and a full
    # ask returning a CITED answer. /alive stayed green through every
    # functional outage on 2026-06-10; this job is the gate the incident
    # postmortems called for. Costs one model call per deploy.
    name: E2E canary (deployed target)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: smoke
    # Explicit condition, and it is load-bearing — without it this canary SKIPS.
    #
    # GitHub propagates "skipped" transitively. `smoke` depends on `deploy-jobs`, which is
    # skipped on any merge that touches no CLI/infra path (the common case). `smoke` itself
    # survives that via its own `!cancelled()`, but a dependent with NO `if:` of its own is
    # skipped anyway — so adding deploy-jobs to smoke's needs silently disabled this job.
    # Observed on df8e280: smoke succeeded, e2e skipped, Deploy still reported green.
    #
    # That is exactly the failure this pipeline exists to prevent — a verification step
    # quietly not running while everything looks healthy. /alive stayed green through the
    # 2026-06-10 functional outage; this canary is the gate the postmortems asked for, so
    # it must never be silently absent.
    #
    # `needs.smoke.result == 'success'` preserves the original semantics (do not canary a
    # deployment whose smoke test failed) rather than the looser `!cancelled()`, which
    # would run it even after a failed smoke.
    if: ${{ !cancelled() && needs.smoke.result == 'success' }}

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Playwright browsers
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Restore
        run: dotnet restore PinballWizard.slnx

      - name: Build (Release)
        run: dotnet build --no-restore --configuration Release tests/PinballWizard.Web.Tests/PinballWizard.Web.Tests.csproj

      - name: Install Playwright browsers
        run: |
          pwsh tests/PinballWizard.Web.Tests/bin/Release/net10.0/playwright.ps1 \
            install --with-deps chromium

      - name: Run E2E against deployed app
        env:
          E2E__BaseUrl: https://${{ needs.smoke.outputs.wizard_fqdn }}
        run: |
          # Route/health + landing-interactivity canaries — exclude only the ask flow
          # (E2E=Ask, WizardE2ETests): it makes a real model call per run (cost + latency)
          # and, being the slowest E2E, previously pushed this job past its 15-min budget
          # and got cancelled. The ask flow is validated by the local full run
          # (tools/e2e/Run-E2E.ps1). Everything else — including the landing seed-card
          # interactivity check (LandingInteractivityCanaryE2ETests, model-call-free and
          # only reliable against a real deployment) — runs here.
          dotnet test \
            --no-build \
            --configuration Release \
            --filter "Category=E2E&E2E!=Ask" \
            --logger "trx;LogFileName=e2e-results.trx" \
            --results-directory ./e2e-results \
            tests/PinballWizard.Web.Tests/PinballWizard.Web.Tests.csproj

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-results
          path: e2e-results/**/*.trx
          if-no-files-found: warn
          retention-days: 14

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Deployment summary
        if: success()
        run: |
          echo "### Deployed + E2E canary green :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag | Target |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| \`pinwiz-web\` | \`${{ github.sha }}\` | ACA app (revision swap) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`pinwiz-api\` | \`${{ github.sha }}\` | ACA app (revision swap) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`pinwiz-rag-indexer\` | \`${{ github.sha }}\` | ACA app (revision swap) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`pinwiz-cli\` | \`${{ github.sha }}\` | 20 ACA Jobs (deployment stack — \`deploy-jobs\` job) |" >> $GITHUB_STEP_SUMMARY

  report:
    # Deploy-health reporter. Any failed leg (build/deploy, smoke, e2e) opens or
    # updates ONE deduplicated deploy-failure issue so a broken deploy is visible
    # without watching the Actions tab — honest failure surfacing per invariant
    # #17. A fully-green deploy closes any open issue, so the issue's open/closed
    # state tracks live deploy health. Mirrors canary.yml's alarm pattern.
    name: Report deploy health
    runs-on: ubuntu-latest
    needs: [detect-changes, build-deploy, deploy-jobs, smoke, e2e]
    if: ${{ always() }}
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      # This job deliberately has no checkout — it only calls the issues API. Without
      # GH_REPO, `gh issue` tries to infer the repo from a local git remote and dies
      # with "not a git repository", silently disabling the whole alarm.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open or update the deploy-failure issue
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          title="🚨 Deploy failing on main"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'Deploy failed on `%s`.\n\nRun: %s\nTime: %s\n\nTriage: open the run, find the failed job (build-deploy / deploy-jobs / smoke / e2e), and fix-forward or revert. This issue auto-closes when a deploy goes green.' \
            "${{ github.sha }}" "$run_url" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          existing=$(gh issue list --state open --label deploy-failure --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing on \`${{ github.sha }}\`. $run_url"
          else
            gh issue create --title "$title" --label deploy-failure --body "$body"
          fi

      - name: Close the deploy-failure issue on a green deploy
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          for n in $(gh issue list --state open --label deploy-failure --json number --jq '.[].number'); do
            gh issue comment "$n" --body "✅ Resolved by \`${{ github.sha }}\` — deploy green. Closing."
            gh issue close "$n"
          done
