name: Sanitization

# Guardrail: block the merge of any commit that re-introduces forbidden
# tokens — old client name, personal email, raw secrets, or credential
# patterns. This is intentionally aggressive; false positives are easy to
# fix, and a leaked secret is not.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sanitization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan committed files for forbidden tokens
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run sanitization scan
        shell: bash
        env:
          # Patterns stored as repo secrets so the actual matched strings
          # never appear in this public workflow file. The personal-identity
          # secret is the OR-ed ERE for the maintainer's personal email and
          # domain (e.g. `name@host|@domain`). The work-email secret is the
          # proactive denylist for the maintainer's work email. Both rules
          # warn-and-skip when their secret is unset so a fresh fork can run
          # the workflow without immediate setup. See the rules below and
          # docs/build-spec.md Phase 2 § Scope item 9.
          PERSONAL_IDENTITY_PATTERN: ${{ secrets.PERSONAL_IDENTITY_PATTERN }}
          WORK_EMAIL_PATTERN: ${{ secrets.WORK_EMAIL_PATTERN }}
        run: |
          set -u

          # Directories and files to skip. The sanitization workflow itself
          # contains every forbidden token by definition; excluding it keeps
          # the scan from flagging its own ruleset.
          EXCLUDES=(
            --exclude-dir=.git
            --exclude-dir=bin
            --exclude-dir=obj
            --exclude-dir=node_modules
            --exclude-dir=coverage
            --exclude-dir=publish
            --exclude=sanitization.yml
            --exclude='*.lock.json'
          )

          fail=0

          # Each rule: human label + grep flags + regex.
          # We use grep -nrIE: line numbers, recursive, skip binaries, ERE.
          # Case sensitivity is per-rule (some patterns must be case-sensitive
          # to avoid false positives like the word "password" appearing in
          # field names).
          run_rule() {
            local label="$1"
            local case_flag="$2"   # -i for case-insensitive, "" otherwise
            local pattern="$3"

            echo "::group::Scan: $label"
            local hits
            if [ -n "$case_flag" ]; then
              hits=$(grep -nrIE $case_flag "${EXCLUDES[@]}" -- "$pattern" . || true)
            else
              hits=$(grep -nrIE "${EXCLUDES[@]}" -- "$pattern" . || true)
            fi

            if [ -n "$hits" ]; then
              echo "::error title=Sanitization failure: $label::Forbidden token(s) found"
              echo "$hits"
              fail=1
            else
              echo "OK"
            fi
            echo "::endgroup::"
          }

          # Wrap a secret-sourced rule with ERE validation + skip-when-unset.
          # Both PERSONAL_IDENTITY_PATTERN and WORK_EMAIL_PATTERN flow through
          # this helper.
          #
          # When the secret is unset: emit a warning and return (so a fresh
          # fork doesn't fail before the maintainer wires the secret).
          #
          # When the secret is set: pre-validate the pattern is a valid ERE
          # before run_rule is invoked. grep -E exits 2 on a malformed
          # pattern, but the `|| true` inside run_rule masks exit 2 as
          # "no match" — silently disabling the rule. Catch malformed
          # patterns here so a typo in the secret fails the workflow with a
          # clear error rather than silently passing.
          #
          # The `|| pattern_rc=$?` is required because the shell runs under
          # `bash -e -o pipefail` (the GitHub Actions default for
          # `shell: bash`). On a well-formed but non-matching pattern,
          # `grep -E` exits with rc=1 against empty stdin — pipefail
          # surfaces that as the pipeline's exit code, and errexit then
          # aborts the script BEFORE the `pattern_rc=$?` capture line can
          # run. The `|| pattern_rc=$?` makes the validation part of an
          # `||`-list, which errexit explicitly skips per the bash manual,
          # while still capturing the exit code for the malformed-pattern
          # check below. Without this bypass, every scan after this block
          # (PEM, RSA, Slack, GitHub PAT, AWS, credential assignments)
          # silently never runs — the failure mode this guard exists to
          # prevent, except worse because it's unobservable.
          run_secret_rule() {
            local label="$1"
            local secret_name="$2"
            local pattern="$3"

            if [ -z "${pattern:-}" ]; then
              echo "::warning title=Sanitization rule skipped: $label::$secret_name secret not configured. Set it in repo settings (Settings → Secrets and variables → Actions) to enable proactive blocking. Other rules continue to run regardless."
              return
            fi

            local pattern_rc=0
            printf '' | grep -E "$pattern" >/dev/null 2>&1 || pattern_rc=$?
            if [ "$pattern_rc" -eq 2 ]; then
              echo "::error title=Sanitization rule misconfigured: $label::$secret_name is not a valid extended regex (grep -E exit 2). Re-set the secret with a valid ERE; remember to escape regex metacharacters like '.' as '\\.'."
              fail=1
              return
            fi

            run_rule "$label" "-i" "$pattern"
          }

          # --- Rules -----------------------------------------------------------

          # Prior client name, scrubbed once already; must not return.
          run_rule "Prior client name (JungleTech)" "-i" "JungleTech"

          # Personal-identity denylist — OR-ed ERE for the maintainer's
          # personal email + domain, stored in the PERSONAL_IDENTITY_PATTERN
          # repo secret so the actual matched strings never appear in this
          # public workflow file. Committed code must use the GitHub noreply
          # email instead. To enable: repo Settings → Secrets and variables
          # → Actions → New repository secret, name PERSONAL_IDENTITY_PATTERN,
          # value an ERE regex (e.g., "name@host|@domain").
          run_secret_rule "Personal identity (secret-sourced)" "PERSONAL_IDENTITY_PATTERN" "${PERSONAL_IDENTITY_PATTERN:-}"

          # Work-email proactive denylist — pattern stored in the
          # WORK_EMAIL_PATTERN repo secret so the actual pattern never
          # appears in this public file. To enable: repo Settings → Secrets
          # and variables → Actions → New repository secret, name
          # WORK_EMAIL_PATTERN, value an ERE regex (e.g.,
          # "@workdomain\.com" or "firstname\.lastname@").
          run_secret_rule "Work email (secret-sourced)" "WORK_EMAIL_PATTERN" "${WORK_EMAIL_PATTERN:-}"

          # Common credential / key markers (case-insensitive).
          run_rule "PEM private key header"           "-i" "BEGIN.*PRIVATE.*KEY"
          run_rule "RSA private key header"           "-i" "BEGIN.*RSA.*PRIVATE"
          run_rule "Slack bot token (xoxb-)"          "-i" "xoxb-"
          run_rule "Slack user token (xoxp-)"         "-i" "xoxp-"
          run_rule "GitHub PAT (ghp_)"                "-i" "ghp_"
          run_rule "GitHub OAuth token (gho_)"        "-i" "gho_"
          run_rule "GitHub user-to-server (ghu_)"     "-i" "ghu_"
          run_rule "GitHub server-to-server (ghs_)"   "-i" "ghs_"
          run_rule "GitHub refresh token (ghr_)"      "-i" "ghr_"
          run_rule "AWS access key id"                "" "AKIA[0-9A-Z]{16}"

          # Literal credential assignments. Case-sensitive on purpose so we
          # do NOT flag legitimate field names like `Password` in C# property
          # declarations. We only fail when a credential-like LHS is
          # paired with a quoted RHS (i.e., an actual literal value).
          run_rule "Literal password assignment"      "" 'password.*=.*"[^"]+"'
          run_rule "Literal api key assignment"       "" 'api[_-]?key.*=.*"[^"]+"'

          # ---------------------------------------------------------------------

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Sanitization failed. See annotations above for matches."
            echo "If a hit is a false positive, narrow the rule rather than"
            echo "broadening the exclude list."
            exit 1
          fi

          echo "All sanitization checks passed."
