name: PR Feedback Triage

# Server-side, governed (comment-only) triage of PR review feedback.
# Runs Claude on GitHub's runners to classify each finding mechanical-vs-judgment
# and post ONE structured comment. It NEVER pushes code (tool-scoped + read-only
# contents). See docs/adr/0041-pr-feedback-triage.md.
#
# NOTE: pull_request_review / issue_comment workflows run the copy of THIS file
# on the default branch — so changes take effect after merge, not from a PR branch.

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

# One in-flight triage per (PR × event type). Bugbot (and similar) often fire
# pull_request_review and pull_request_review_comment nearly together; a single
# PR-wide group with cancel-in-progress cancelled one run and left a red/cancelled
# "triage" required check (#1077 / #1083). Scope by event_name so those paths do
# not cancel each other; same-event bursts still supersede. Parallel event types
# can still race to post — the "Find existing triage comment" step + upsert
# prompt below collapses them onto one <!-- claude-triage --> comment.
concurrency:
  group: pr-triage-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read          # base checkout only — never write, never push
  pull-requests: write    # post the triage comment
  issues: write           # PR conversation comments use the issues API
  id-token: write         # OIDC token for WIF → Anthropic access token exchange

jobs:
  triage:
    runs-on: ubuntu-latest
    # Guards (all must hold):
    #  - issue_comment also fires on plain issues — require a PR association
    #  - loop guard: never react to our own triage comment (marker)
    #  - fork/secret safety on review events: same-repo head only
    #  - skip dependency/CI bots that comment on PRs but are not review bots.
    #    Renovate's "Edited/Blocked" notice and github-actions coverage badges
    #    would otherwise hard-fail allowed_bots (run 43790824402 on #1072).
    #    Do NOT add them to allowed_bots — #998: that list is a trust boundary;
    #    skip here so absence of triage is a neutral job skip, not a red check.
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request != null) &&
      !contains(github.event.comment.body, '<!-- claude-triage -->') &&
      (github.event_name == 'issue_comment' ||
       github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'
    steps:
      # Base ref only (no ref:) — untrusted PR head code is NEVER checked out or run,
      # which is the real mitigation that makes comment-only safe even for fork PRs.
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # When review + review_comment race (allowed by event-scoped concurrency),
      # both jobs would otherwise post a fresh <!-- claude-triage --> comment.
      # Resolve any existing marker comment up front so the prompt can PATCH it.
      - name: Find existing triage comment
        id: existing_triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ github.event.pull_request.number || github.event.issue.number }}"
          ID="$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- claude-triage -->"))] | first | .id // empty')"
          echo "comment_id=${ID}" >> "$GITHUB_OUTPUT"
          if [ -n "${ID}" ]; then
            echo "Found existing triage comment id=${ID}"
          else
            echo "No existing triage comment"
          fi

      - name: Triage PR feedback (comment only)
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1
        env:
          EXISTING_TRIAGE_COMMENT_ID: ${{ steps.existing_triage.outputs.comment_id }}
        with:
          # #804 root cause (proved by the probe on run 31517799430): the action
          # sends anthropic_api_key as a static x-api-key header, but a WIF
          # access token is only valid as a Bearer token — the API rejected every
          # run before inference ({is_error:true, num_turns:1, cost 0}) while a
          # direct Bearer probe with the SAME token returned HTTP 200. The action
          # has native WIF support: given these ids it performs the GitHub-OIDC
          # exchange itself and authenticates the API call correctly. Requires
          # the id-token: write permission (already granted above).
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          # #804: without an explicit token the action attempts its own
          # OIDC → Anthropic-GitHub-App installation-token exchange, which fails
          # 401 ("User does not have write access on this repository") on every
          # run — the App is not installed with write access here, and this
          # action version does not fall back to GITHUB_TOKEN. Passing the
          # workflow token (scoped above: contents read, PRs/issues write) makes
          # the action use it directly (OVERRIDE_GITHUB_TOKEN in action.yml) and
          # skips the doomed exchange.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # #865: this input defaults to "" and an empty value allows NO bots, so
          # every bot-authored review — which is the only kind this workflow exists
          # to triage — was rejected before any work happened. Verified against
          # anthropics/claude-code-action action.yml at the commit v1 resolves to
          # (903583c): "Comma-separated list of allowed bot usernames, or '*' to
          # allow all bots. Empty string (default) allows no bots."
          #
          # Named explicitly rather than '*'. This repository is PUBLIC, and the
          # same input's documentation warns that on a public repo '*' lets
          # external Apps invoke this action with prompts they control — the
          # prompt below is handed straight to a model with write-scoped repo
          # credentials, so widening this is a real privilege decision, not a
          # convenience toggle.
          #
          # Named bots observed reviewing PRs here (not '*': public repo, and
          # the prompt below goes to a model with write-scoped credentials).
          # A new scanning bot is rejected until added — intended fail-loud.
          # cursor[bot] included so Bugbot review comments (and agent replies
          # that re-fire pull_request_review_comment) can be triaged without
          # "non-human actor" hard-fail (observed on #1026).
          allowed_bots: "github-advanced-security[bot],github-code-quality[bot],cursor[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number || github.event.issue.number }}

            A review event fired on this pull request. Your job is TRIAGE ONLY —
            you must NOT edit files, push commits, approve, or request changes.

            Steps:
            1. Read the PR's review threads, inline review comments, and check
               results. Use: `gh pr view <PR> --comments`, `gh pr diff <PR>`,
               and `gh api repos/${{ github.repository }}/pulls/<PR>/comments`
               and `.../reviews`. Read only the NEW, unaddressed feedback.
            2. If there is no new actionable feedback (e.g. the only new comment is
               your own prior triage, a coverage badge, or chit-chat), do NOTHING —
               post no comment and exit. Cheap no-op.
            3. Otherwise classify each finding:
               - MECHANICAL: style/lint/format, missing-test, simple rename,
                 obvious local fix.
               - JUDGMENT: design/architecture/security/behavioral trade-off.
            4. Upsert EXACTLY ONE triage comment. The body MUST begin with the
               literal marker on its own line:
               <!-- claude-triage -->
               Then two sections:
               - "### Mechanical (ready-to-apply)" — each item with a concrete
                 patch/diff or precise instruction a human can apply under their
                 own identity.
               - "### Needs your judgment" — each item with the reviewer's point
                 and your reasoning, ending "→ your call".
               If a section is empty, write "_None._" under it.

               If env EXISTING_TRIAGE_COMMENT_ID is non-empty, UPDATE that
               comment (do not create a second one):
                 gh api -X PATCH repos/${{ github.repository }}/issues/comments/$EXISTING_TRIAGE_COMMENT_ID \
                   -f body="$(cat <<'EOF'
               ...full body including marker...
               EOF
               )"
               Otherwise create once via `gh pr comment <PR> --body <...>`.

            Constraints: at most one triage comment on the PR (create or
            update); never modify code; never push; never approve or request
            changes. If you cannot read the feedback, say so honestly in the
            comment rather than guessing.
          claude_args: |
            --max-turns 8
            --model claude-sonnet-4-6
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh pr comment:*)"
