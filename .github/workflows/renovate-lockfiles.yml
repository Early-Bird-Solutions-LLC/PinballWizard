name: Renovate lockfiles

# Regenerates the committed packages.lock.json graph on Renovate branches.
#
# WHY THIS EXISTS
#
# Renovate edits central package versions in Directory.Packages.props but its own
# artifact step cannot regenerate this repo's lock files, so affected PRs arrive
# with `renovate/artifacts: Artifact file update failure` and a lock file still
# describing the OLD versions. Where package versions actually moved, ci.yml's
# `dotnet restore --locked-mode` then fails the restore step with NU1004 across the
# affected projects (8 of 20 on #936). Where they did not, the artifacts failure is
# cosmetic — #957 carries it with every other check green, because it changed only
# a Terraform lock. That contrast is what isolates the broken half to .NET.
#
# Renovate runs lock-file maintenance by shelling out to `dotnet` as an external
# subprocess in its own execution environment, which we can neither see nor fix, so
# this workflow does the regeneration on our runner using the same pinned
# setup-dotnet and the same global.json as ci.yml.
#
# SCOPE, STATED HONESTLY
#
# 14 packages.lock.json files are tracked; 13 of them belong to projects reachable
# from PinballWizard.slnx. `tools/probe-collisions` is outside the solution, so it
# is regenerated by neither this workflow nor ci.yml's locked-mode restore, and its
# lock file is not maintained by either. That is pre-existing, not introduced here,
# but it is why the two numbers differ wherever they appear below.
#
# WHY IT PUSHES WITH A GITHUB APP TOKEN AND NOT GITHUB_TOKEN
#
# This is the design constraint, and getting the reasoning wrong is how the App token
# later gets "simplified" away.
#
# All of main's required status checks come from `pull_request`-triggered
# workflows, and none of them is triggered by a push to renovate/**: ci.yml,
# codeql.yml and sanitization.yml restrict `push:` to [main], while
# container-build.yml and docs-agent-guard.yml have NO `push:` trigger at all.
# (An earlier version of this comment claimed all five declared
# `push: branches: [main]`. The conclusion held; the reason was wrong for two of
# them, which is the kind of premise a future reader checks before trusting the
# design argument built on it.) What re-runs them on a new commit is the
# `pull_request: synchronize` event on the open Renovate PR.
#
# GitHub documents that "events triggered by the GITHUB_TOKEN will not create a new
# workflow run", and for `pull_request` opened/synchronize/reopened specifically it
# creates the runs in an **approval-required** state. Either way a GITHUB_TOKEN
# push leaves every required context incomplete until a human clicks approve, on
# every single run — which defeats the automation entirely. Pushing as a real
# identity raises `synchronize` normally and the checks just run.
#
# The GITHUB_TOKEN below is deliberately left `contents: read`. That is least
# privilege, plus a second line of defence: if someone flips `persist-credentials`
# back to true, or adds a `token:` input to checkout, the credential that then
# gets persisted is read-only — so the push 403s instead of quietly succeeding as
# the Actions bot and producing a head SHA whose checks never complete.
#
# Be precise about the CURRENT config though, because an earlier version of this
# comment was not: with `persist-credentials: false` and no `token:` input,
# checkout removes its auth config before the step ends, so NO credential of any
# kind survives into later steps — GITHUB_TOKEN included. Deleting the push's
# explicit auth therefore fails for lack of any credential at all, not because
# GITHUB_TOKEN was read-only. The App token is also the only write credential
# reaching GIT; it is additionally exposed as an env var to the probe step.
#
# WHY A GITHUB APP RATHER THAN A PERSONAL ACCESS TOKEN
#
# A fine-grained PAT would work, and was the first design here. An App is better on
# every axis that matters for a credential that lives in CI indefinitely:
#
#   - The token this mints is an INSTALLATION token valid for one hour, and
#     `skip-token-revoke` defaults to false so the action revokes it in its post
#     step. A PAT is long-lived by construction.
#   - It is not tied to a person, so it survives offboarding, cannot act as the
#     maintainer, and shows up in the audit log as the App.
#   - Nothing here expires on a calendar. A fine-grained PAT can be issued with no
#     expiry at all — GitHub permits infinite lifetimes unless an org policy blocks
#     them, and this is a personal-account repo so none does — which in practice
#     makes it a permanent credential nobody re-reviews. Give it an expiry instead
#     and you have scheduled a future outage whose cause nobody remembers. This
#     token is minted per run, so neither applies.
#   - Repository scope is pinned at mint time, and the permissions the token
#     carries are pinned HERE rather than inherited from the App (see the mint
#     step) — so widening the App cannot widen this job's token.
#
# What is still a long-lived secret: the App's PRIVATE KEY. That is a real trade,
# not a free win — a leaked private key can mint tokens with the App's permissions
# until it is revoked. The honest difference is ATTRIBUTION rather than raw power:
# a fine-grained PAT scoped to this repo with only Contents:write cannot do more
# than this token can, but it acts as the maintainer in the audit log and in commit
# identity, and it dies with their account. That is why this is the chosen option,
# not a perfect one.
#
# OPERATOR SETUP (required once — without it this workflow FAILS, by design)
#   1. Settings -> Developer settings -> GitHub Apps -> New GitHub App.
#      Permissions: Repository -> Contents: Read and write. Nothing else.
#   2. Install it on THIS repository only.
#   3. Generate a private key.
#   4. Store the App's CLIENT ID as the repository VARIABLE
#      `LOCKFILE_APP_CLIENT_ID` (a variable, not a secret — the identifier is the
#      non-secret half of the pair) and the private key as the repository SECRET
#      `LOCKFILE_APP_KEY`.
#
#      Client ID, NOT App ID — they are different values (`Iv23li…` versus a
#      number). The action still accepts `app-id`, but marks it deprecated
#      (`deprecationMessage: "Use 'client-id' instead."` in its action.yml at the
#      pinned SHA) and emits a warning annotation for it.
#
#      `LOCKFILE_APP_KEY` is deliberately shorter than the descriptive name you
#      would otherwise reach for. `local-pr-review.py` blocks any diff line
#      containing the word "private" joined by an underscore to "key", matched
#      case-insensitively as a bare substring. The descriptive name embeds exactly
#      that, so every line merely NAMING the secret trips a secret-detection
#      blocker — none of them key material. The scanner does offer supported
#      escapes (an `example`/`test` substring on the line, or a `pr-review: allow`
#      pragma), so taking one would be legitimate rather than a bypass; the short
#      name is simply cheaper than annotating five lines. Do not "improve" the
#      name back without taking one of those routes. (This comment avoids the
#      literal for the same reason — spelling it out tripped the check twice while
#      being written.)
#
#   If pushes later fail on Renovate's github-actions branches specifically (the
#   ones where Renovate edits .github/workflows/** for action-pin bumps) while
#   succeeding elsewhere, that needs TWO changes, not one: grant the App
#   Workflows: Read and write, AND add `permission-workflows: write` to the mint
#   step. Granting it on the App alone does nothing while the mint step pins
#   permissions — which is the point: widening the App cannot silently widen the
#   token this job holds while `dotnet restore` runs.
#
#   Our own commit touches no workflow file, so Contents alone is expected to
#   suffice — "expected" because that is reasoning about how GitHub evaluates the
#   check for a fast-forward, not something verified.
#
# It fails loudly rather than skipping when either credential is absent or
# unusable. A
# silent skip would leave every Renovate PR red with NU1004 and nothing saying why
# the regeneration never ran. (The governing rule is the user-global
# `no-masking-skips.md`, not a file in this repo: a job that cannot do its work
# must fail, never report green having done nothing. The repo-local expression of
# the same idea is invariant #17 / OBS-01.)

on:
  # No paths filter, deliberately. The one thing a Renovate PR does NOT contain is
  # the lock files themselves, so a `paths:` allowlist here would have to list
  # exactly the files that are missing from the diff it is filtering on. The repo
  # also has history with allowlists drifting out of step with what mattered —
  # deploy.yml:76-85 records `infra/**` and `deploy/**` each having been omitted,
  # the second found only when a merge "triggered nothing". A Renovate branch that
  # moves no package versions simply produces no lock-file diff and the job ends
  # without committing, so running always costs two restores and the stale-filter
  # alternative costs a silently unregenerated lock file.
  push:
    branches:
      - 'renovate/**'

permissions:
  contents: read # the App token performs the write; GITHUB_TOKEN deliberately stays read-only

concurrency:
  group: renovate-lockfiles-${{ github.ref }}
  # NOT cancel-in-progress. Our own push re-triggers this workflow on the same
  # ref, and concurrency is resolved when the new run is QUEUED — before the
  # job-level `if:` can skip it. So cancellation would fire from the no-op run
  # against the run that just did the work, which would then report `cancelled`
  # and never write its summary. A cancelled conclusion also cannot distinguish
  # "pushed, then self-cancelled" from "cancelled before pushing", which is
  # exactly the ambiguity an operator cannot afford here. Serialising without
  # cancelling costs at most one wasted run when Renovate force-pushes mid-restore,
  # and `--force-with-lease` already makes that run fail safely rather than clobber.
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate packages.lock.json
    # ubuntu-latest, matching ci.yml. Worth knowing why it matters: measured on one
    # Windows dev box, `dotnet restore --force-evaluate` rewrote the lock files with
    # CRLF, so `git status` reported them all as modified while the content was
    # byte-identical. That is a one-box observation, not a verified platform
    # invariant. It cannot reach a commit here anyway: .gitattributes declares
    # `* text=auto eol=lf` and `*.json text eol=lf`, and this runner is Linux. Do
    # not "fix" a noisy diff by loosening the change detection below.
    runs-on: ubuntu-latest
    timeout-minutes: 15 # matches ci.yml, which does strictly more work

    # Loop guard, keyed on the commit AUTHOR rather than the commit message.
    #
    # Our own push re-triggers this workflow by design, so something must stop the
    # second run. An earlier version tested the message for a `[lockfile-regen]`
    # marker, which `contains()` matches as free text — and `git revert` of a regen
    # commit produces `Revert "chore(deps) regenerate packages.lock.json
    # [lockfile-regen]"`, carrying the marker into the message of the commit that
    # deliberately removes the regenerated files. The guard would then skip the run
    # in the exact state regeneration is most needed. Authorship cannot be quoted
    # into a message by accident, so it keys on the identity set below.
    #
    # The null test covers a branch-deletion push, where head_commit is absent:
    # without it `contains(null, …)` is false, the job runs, and checkout fails
    # against a ref that no longer exists. Renovate prunes branches routinely.
    #
    # Belt and braces: even if this guard were bypassed, the change detection in the
    # commit step exits without pushing when there is no diff, so no run can push
    # twice and no loop can sustain itself.
    if: >-
      ${{ github.event.head_commit != null
          && github.event.head_commit.author.email != '41898282+github-actions[bot]@users.noreply.github.com' }}

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      LOCKFILE_PATHSPEC: '*packages.lock.json'

    steps:
      - name: Verify the App credentials are configured
        # Checked before minting so an absent credential names ITSELF — and names it
        # in terms of the repository-level identifiers an operator has to go and
        # create. The action's own error is specific enough ("The 'private-key'
        # input must be set to a non-empty string..."), so this step earns its place
        # by naming LOCKFILE_APP_CLIENT_ID / LOCKFILE_APP_KEY and carrying the
        # don't-reach-for-GITHUB_TOKEN warning, not by being more legible.
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.LOCKFILE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.LOCKFILE_APP_KEY }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${APP_CLIENT_ID}" ] && missing="${missing} LOCKFILE_APP_CLIENT_ID(variable)"
          [ -z "${APP_KEY}" ] && missing="${missing} LOCKFILE_APP_KEY(secret)"
          if [ -n "${missing}" ]; then
            echo "::error::Missing GitHub App credentials:${missing}"
            echo "::error::"
            echo "::error::Without them the lock files cannot be pushed back to the Renovate"
            echo "::error::branch, so Renovate PRs that move package versions stay red with"
            echo "::error::NU1004."
            echo "::error::"
            echo "::error::Do NOT 'fix' this by switching to GITHUB_TOKEN. Every required"
            echo "::error::check on main comes from a pull_request-triggered workflow, and a"
            echo "::error::GITHUB_TOKEN push creates those runs in an approval-required state"
            echo "::error::(or not at all), so they never complete without a manual click."
            echo "::error::"
            echo "::error::Create a GitHub App with Repository -> Contents: Read and write,"
            echo "::error::install it on this repo only, then set the repository variable"
            echo "::error::LOCKFILE_APP_CLIENT_ID and the repository secret LOCKFILE_APP_KEY."
            exit 1
          fi
          echo "App credentials present."

      - name: Mint a short-lived App installation token
        id: app-token
        # `owner` and `repositories` are BOTH omitted on purpose, and the omission is
        # load-bearing. Per the action's own input docs, `repositories` "defaults to
        # current repository **if owner is unset**" — so the two defaults are coupled.
        # Setting `owner` alone (the natural-looking tidy-up) widens the token to
        # every repository the installation can reach. Not quite silently — the
        # action logs "Creating token for all repositories owned by …" — but that is
        # a log line nobody reads. Omitting both scopes it to this repository only.
        #
        # Today that hazard is bounded anyway, because setup step 2 installs the App
        # on this repository alone, so "all repositories" would be one. This is
        # therefore defence in depth, and it becomes the primary control the moment
        # anyone adds a second installation target.
        #
        # The token expires after one hour, and `skip-token-revoke` defaults to
        # false, so the action revokes it in its post step rather than leaving it
        # valid for the remainder of the hour.
        #
        # `permission-contents: write` is NOT redundant with the App's own grant.
        # Verified in the action's lib/get-permissions-from-inputs.js: with no
        # `permission-*` input it passes `undefined`, and the token then inherits
        # ALL of the installation's permissions. Pinning the single permission this
        # job needs means a later widening of the App cannot silently widen a token
        # held by a job that runs branch-controlled MSBuild logic. It also fails
        # earlier and more precisely: an App left at Contents:Read fails at MINT
        # with a 422 naming the permission, rather than at the probe below.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.LOCKFILE_APP_CLIENT_ID }}
          private-key: ${{ secrets.LOCKFILE_APP_KEY }}
          permission-contents: write

      - name: Verify the minted token can actually write
        # Minting succeeding is not the same as the App being installed here with
        # the access this job needs. Probe it now so a misconfiguration is named in
        # seconds rather than arriving minutes later as a bare 403 from git.
        #
        # UNVERIFIED premise, stated rather than assumed away: this reads
        # `.permissions.push` from GET /repos/{owner}/{repo}, and whether that field
        # is populated for an INSTALLATION token could not be checked without
        # minting one. If it comes back null this step fails on a correctly
        # configured App — i.e. it would name the wrong cause, which is exactly what
        # it exists to avoid. Confirm on the first real run and correct this comment.
        # What it cannot see either way: branch protection or rulesets on
        # renovate/**, and the workflows:write case described in the header.
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Through env, not interpolated into the script body — the discipline
          # every other value in this file follows.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          if ! PERMS=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.permissions.push' 2>&1); then
            echo "::error::The App token could not read repos/${GITHUB_REPOSITORY}."
            echo "::error::Most likely the App is not installed on this repository, or is"
            echo "::error::installed without access to it. gh reported: ${PERMS}"
            exit 1
          fi
          if [ "${PERMS}" != "true" ]; then
            echo "::error::The App token has no push access to ${GITHUB_REPOSITORY}."
            echo "::error::Grant the App Repository -> Contents: Read and write; it is almost"
            echo "::error::certainly still set to Read."
            exit 1
          fi
          echo "App token has push access (app: ${APP_SLUG})."

      - name: Checkout the Renovate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          # No `token:` input and persist-credentials: false, together, so NO
          # credential is on disk while `dotnet restore` runs. That matters because
          # restore evaluates Directory.Build.props, custom targets and NuGet.Config
          # FROM THE CHECKED-OUT BRANCH, and Renovate edits .github/workflows/** on
          # renovate/** branches (pinDigests + the github-actions manager) — branch
          # content is not inert. With the default this step would persist
          # GITHUB_TOKEN; passing the App token here instead would persist a
          # WRITE-scoped credential, which is strictly worse. The push step supplies
          # auth explicitly, once, after every restore has finished.
          #
          # Checkout still needs read access to fetch: that comes from the job's
          # read-only GITHUB_TOKEN, which is also what creates the
          # refs/remotes/origin/<branch> ref that --force-with-lease resolves against.
          persist-credentials: false

      - name: Set up .NET
        # global-json-file, not a literal version: Renovate's dotnet-monorepo group
        # also bumps global.json (it moved the pin 10.0.200 -> 10.0.401 on #936), so
        # the SDK installed must come from the branch's own global.json or the
        # restore fails with "A compatible .NET SDK was not found" (exit 155,
        # reproduced locally). Identical action, SHA and input as ci.yml, so the SDK
        # that writes the lock files is the one that later verifies them.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          # The primary key is stale by definition here — we are about to change the
          # very files it hashes — so restore-keys is what actually does the work.
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Assert the lock-file pathspec still describes this repo
        id: scope
        # The positive control for the whole workflow. Everything downstream decides
        # "was there work to do?" from a diff, and `git diff --quiet` exits 0 when
        # its pathspec matches NOTHING - verified: `git diff --quiet --
        # '**/packages.lock.jsonx'` returns 0. So a pathspec that stops matching is
        # indistinguishable from a graph that was already correct: the job goes
        # green forever while every Renovate PR stays red, and the summary actively
        # asserts the graph was fine. Anchor it to a measured count first.
        #
        # This also catches the git pathspec trap that bit the first version of this
        # file: a default pathspec needs a literal '/', so '**/packages.lock.json'
        # silently excludes a repo-root lock file. Verified in this repo:
        # `git ls-files -- '**/global.json'` returns 0 while global.json IS tracked
        # at the root. Hence LOCKFILE_PATHSPEC is '*packages.lock.json'.
        shell: bash
        run: |
          set -euo pipefail
          FOUND=$(git ls-files -- "${LOCKFILE_PATHSPEC}" | wc -l | tr -d ' ')
          if [ "${FOUND}" -lt 1 ]; then
            echo "::error::The pathspec '${LOCKFILE_PATHSPEC}' matches no tracked files."
            echo "::error::"
            echo "::error::A 'no changes' result from this workflow would therefore be"
            echo "::error::meaningless - git diff exits 0 for a pathspec that matches nothing,"
            echo "::error::so the job would report success having regenerated nothing, forever."
            echo "::error::"
            echo "::error::The lock files have been moved, renamed, or untracked. Fix the"
            echo "::error::LOCKFILE_PATHSPEC env value before trusting this workflow again."
            exit 1
          fi
          echo "found=${FOUND}" >> "$GITHUB_OUTPUT"
          echo "Tracked lock files matching '${LOCKFILE_PATHSPEC}': ${FOUND}"

      - name: Regenerate lock files
        # --force-evaluate re-resolves and rewrites packages.lock.json.
        # RestorePackagesWithLockFile=true in Directory.Build.props opts the tree in
        # (six projects opt back out in their own csproj), and a committed lock file
        # opts a project in on its own regardless. Locked mode is NOT a global
        # property here - it arrives only as ci.yml's `--locked-mode` flag - which is
        # what makes this restore free to rewrite the files. If it were a property,
        # combining it with force-evaluate would itself be an error (NU1005/NU1512).
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore --force-evaluate PinballWizard.slnx

      - name: Sanity-check the regenerated graph in locked mode
        # Deliberately modest about what this proves. It runs in the same tree the
        # previous step just wrote, so locked mode agrees largely by construction -
        # it is a cheap sanity check, NOT the guarantee. The real guarantee is
        # ci.yml re-running on the pushed commit with a cold cache. It is kept
        # because it is nearly free and it runs BEFORE the push, so anything it does
        # catch is caught without leaving a commit behind; and because locked-mode
        # rejection is a live hazard in this repo (ci.yml notes Web.Tests opting out
        # over Razor SDK RID assets).
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore --locked-mode PinballWizard.slnx

      - name: Commit and push if the graph changed
        id: commit
        shell: bash
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Identity first, because the loop guard keys on this address. It MUST
          # stay in sync with `gitIgnoredAuthors` in .github/renovate.json5 and with
          # the `if:` condition above - change one, change all three. Without the
          # renovate.json5 entry Renovate treats this commit as a user modification
          # and stops updating the branch entirely, converting a red PR into a stuck
          # one.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage FIRST, then ask the index what changed. `git diff` ignores
          # untracked files while `git add` includes them, so testing the worktree
          # and then staging would miss a brand-new lock file entirely: the job
          # would print "no changes" and exit green leaving it uncommitted, which
          # under ci.yml's locked-mode restore is precisely what reds the PR. One
          # definition of "changed", used by both.
          git add -- "${LOCKFILE_PATHSPEC}"

          # Three-way, because `git diff --quiet` returns 0 (clean), 1 (changed) or
          # >=2 (git error - bad pathspec, unreadable index). Collapsing an error
          # into either real answer is how a broken check reports a clean one.
          rc=0
          git diff --cached --quiet -- "${LOCKFILE_PATHSPEC}" || rc=$?
          case "${rc}" in
            0)
              echo "No lock-file changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            1) : ;; # there are staged changes - carry on
            *)
              echo "::error::git diff --cached failed (exit ${rc})."
              echo "::error::Cannot determine whether the lock files changed, so this job"
              echo "::error::refuses to report either outcome."
              exit 1
              ;;
          esac

          git commit -m "chore(deps) regenerate packages.lock.json"

          # --force-with-lease, never bare --force: Renovate rebases and recreates
          # its own branches, and a blind force could discard a newer Renovate commit
          # pushed between our checkout and this push. The lease turns that collision
          # into a loud failure instead of silent data loss.
          #
          # Auth via extraheader rather than a persisted credential (see
          # persist-credentials: false above) so the token is only present for this
          # one command, after every restore has already run.
          # The action calls core.setSecret on the RAW token, so that string is
          # masked. This base64 blob is a DIFFERENT string, is not masked by
          # inheritance, and is directly usable as a credential — so register it.
          # Nothing prints it today (no `set -x`), but this repo is public and one
          # GIT_TRACE=1 added while debugging a push would dump a live write
          # credential into the logs.
          AUTH=$(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)
          echo "::add-mask::${AUTH}"
          if ! git -c "http.extraheader=AUTHORIZATION: basic ${AUTH}" \
                 push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "::error::Push to ${GITHUB_REF_NAME} was rejected."
            echo "::error::"
            echo "::error::Most likely cause: Renovate force-pushed this branch after our"
            echo "::error::checkout. That is EXPECTED and self-healing - Renovate's new head"
            echo "::error::commit has a different author, so it triggers a fresh run of this"
            echo "::error::workflow which regenerates against the new versions."
            echo "::error::"
            echo "::error::If this repeats on a branch nobody is touching, suspect"
            echo "::error::the App instead - uninstalled from this repo, or Contents downgraded"
            echo "::error::to read-only."
            echo "::error::"
            echo "::error::If it fails ONLY on branches where Renovate edited"
            echo "::error::.github/workflows/** (action-pin bumps), that is the workflows"
            echo "::error::case, NOT a Contents problem - the probe above will have reported"
            echo "::error::push access as fine and it was telling the truth. Grant the App"
            echo "::error::Workflows: Read and write AND add permission-workflows: write to"
            echo "::error::the mint step; see OPERATOR SETUP in this file's header."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        # if: always() - every failure path above otherwise leaves
        # $GITHUB_STEP_SUMMARY empty, so a reader lands on a red run with no
        # summary-level explanation and has to open step logs to learn anything.
        if: always()
        shell: bash
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          FOUND: ${{ steps.scope.outputs.found }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            if [ "${OUTCOME}" != "success" ]; then
              echo "### Lock-file regeneration FAILED (${OUTCOME})"
              echo ""
              echo "Likely causes, in the order they occur:"
              echo "- App credentials missing, or the App lacks Contents: write"
              echo "- the lock-file pathspec no longer matches this repo"
              echo "- \`dotnet restore\` failed for this branch's package versions"
              echo "- the push was rejected because Renovate force-pushed concurrently"
              echo ""
              echo "See the failing step's annotations - each names its own cause."
            elif [ "${CHANGED}" = "true" ]; then
              echo "### Lock files regenerated"
              echo ""
              echo "Pushed to \`${GITHUB_REF_NAME}\`. The open Renovate PR's checks re-run"
              echo "on the new commit via \`pull_request: synchronize\`."
            else
              # Says only what was measured. The earlier version asserted "the
              # committed graph already matched this branch's package versions",
              # which is a stronger claim than a empty diff supports - and it is
              # exactly the sentence that would stop someone investigating.
              echo "### No lock-file changes"
              echo ""
              echo "${FOUND} tracked lock file(s) were re-evaluated and none changed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
