name: Lighthouse CI

# Performance / Accessibility / SEO gate for the public Blazor frontend.
# Runs on PRs that touch the Web project or this workflow/config file.
#
# Thresholds (quality-spec.md § Performance regression tests, Phase 5+):
#   Performance  ≥ 70 (warn)  — starts at 70; SSR without static CSS/JS is
#                               penalized by Lighthouse. Ratchet to 90 when
#                               real static assets are fingerprinted + served
#                               with far-future cache headers.
#   Accessibility ≥ 90 (error) — axe-core guarantees WCAG at component level;
#                               Lighthouse audits complement at page level.
#   Best-Practices ≥ 90 (error)
#   SEO           ≥ 90 (warn)
#
# See .lighthouserc.json at repo root for the lhci config.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/PinballWizard.Web/**'
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.json'
  push:
    branches: [main]
    paths:
      - 'src/PinballWizard.Web/**'
      - '.github/workflows/lighthouse.yml'
      - '.lighthouserc.json'
      - 'src/PinballWizard.PerfMetrics/**'

permissions:
  contents: read
  id-token: write   # OIDC token for emitter's az login (push to main only)

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Lighthouse (Performance / Accessibility / SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      # Production environment matches how the app runs on Azure Container Apps.
      # Static web assets (MudBlazor.min.css, blazor.web.js, _framework/*) are
      # physically present in the publish output, so no development-time asset
      # pipeline is needed. UseHttpsRedirection/UseHsts are intentionally absent
      # (Container Apps LB terminates TLS before traffic reaches the container).
      ASPNETCORE_ENVIRONMENT: Production
      # Bind only to the plain HTTP port — no HTTPS listener needed in CI.
      ASPNETCORE_URLS: 'http://localhost:5000'
      # Microsoft Identity Web's MergedOptionsValidation.Validate() fires on
      # the first request (even for [AllowAnonymous] routes) and checks three
      # fields in sequence: Instance → TenantId → ClientId. Any empty field
      # throws IDW10106, which propagates as HTTP 500 through the /alive
      # endpoint. Placeholder GUIDs satisfy the validation without enabling
      # real OIDC — no token is ever exchanged on anonymous public routes.
      AzureAd__Instance: 'https://login.microsoftonline.com/'
      AzureAd__TenantId: '00000000-0000-0000-0000-000000000000'
      AzureAd__ClientId: '00000000-0000-0000-0000-000000000000'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode PinballWizard.slnx

      # Publish (not just build) so all static web assets are physically present
      # in the output directory. dotnet run uses a "Build" manifest that expects
      # a StaticAssetDevelopmentRuntimeHandler to resolve NuGet package paths at
      # runtime; those Windows-absolute paths don't exist on Linux CI, causing
      # HTTP 500 for _content/MudBlazor/MudBlazor.min.css and
      # _framework/blazor.web.js — the root cause of the NO_FCP Lighthouse
      # failure. dotnet publish produces a "Publish" manifest with all assets
      # physically copied under wwwroot/, eliminating the path-resolution problem.
      - name: Publish (Release)
        run: >
          dotnet publish --no-restore --configuration Release
          src/PinballWizard.Web/PinballWizard.Web.csproj
          --output /tmp/pwapp

      # Start the published app. Foundry and Cosmos are not configured in CI
      # (AiFoundry:ProjectEndpoint is empty, no connection string present) — both
      # are gated in Program.cs so the app starts cleanly without them. Public
      # routes (/wizard, /) are [AllowAnonymous] so no Entra token is required.
      - name: Start web app
        run: |
          dotnet /tmp/pwapp/PinballWizard.Web.dll \
            > /tmp/app.log 2>&1 \
            &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      # Poll until the app returns HTTP 200 on /alive or the 60s budget expires.
      # /alive uses Predicate = r => r.Tags.Contains("live"); with zero "live"
      # health checks registered, it returns Healthy (200) as soon as Kestrel
      # is accepting connections. A diagnostic loop (not --fail) logs each
      # attempt's status code so CI failures can be triaged from the log.
      - name: Wait for app to be ready
        run: |
          echo "Waiting for http://localhost:5000/alive ..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                        --connect-timeout 2 \
                        http://localhost:5000/alive 2>/dev/null || echo "000")
            echo "  attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "App is ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "App did not become ready within 60s (last code: $CODE)."
              echo "--- app startup log ---"
              cat /tmp/app.log || true
              exit 1
            fi
            sleep 2
          done

      # Diagnostic: verify the pages return meaningful HTML before Lighthouse runs.
      # NO_FCP means Chrome got the page but saw no paintable content. Checking
      # the HTTP status and first 300 bytes of HTML helps distinguish: empty body
      # (SSR failure), redirect, or render-blocking resource 404.
      - name: Verify page responses
        run: |
          for path in "/" "/wizard"; do
            CODE=$(curl -s -o /tmp/page.html -w "%{http_code}" "http://localhost:5000${path}")
            SIZE=$(wc -c < /tmp/page.html)
            echo "GET ${path}: HTTP $CODE, ${SIZE} bytes"
            head -c 300 /tmp/page.html
            echo ""
          done

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Collect Lighthouse reports
        run: lhci collect

      - name: Assert Lighthouse thresholds
        run: lhci assert

      # ── Azure login for the perf emitter (push to main only) ─────────────────
      # Mirrors the pattern in deploy.yml: OIDC federated credential, no long-lived
      # secret. Required so az monitor app-insights component show can fetch the
      # App Insights connection string at runtime (DisableLocalAuth means no key).
      - name: Azure login (emitter)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Emit one App Insights log record ("LighthouseRun") per main merge so the
      # perf trend dashboard can chart scores + Core Web Vitals over time.
      # Resource name derived from shared.bicep: namePrefix=pinwiz, environment=dev
      # → var appInsightsName = '${namePrefix}-ai-${environment}' = pinwiz-ai-dev.
      # Connection string is non-secret under DisableLocalAuth — fetched at runtime.
      # --no-restore: the earlier locked-mode restore already covers the slnx, so
      # `dotnet run` must not trigger an implicit non-locked restore (keeps the
      # locked-mode supply-chain guarantee intact for this step).
      - name: Emit perf trend to App Insights (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          CS=$(az monitor app-insights component show \
                 --app pinwiz-ai-dev \
                 --resource-group rg-pinwiz-shared-dev \
                 --query connectionString -o tsv)
          [ -n "$CS" ] || { echo "ERROR: empty App Insights connection string from az — aborting emit."; exit 1; }
          dotnet run --project src/PinballWizard.PerfMetrics -c Release --no-restore -- \
            --reports-dir .lighthouseci \
            --environment synthetic \
            --commit-sha "${{ github.sha }}" \
            --connection-string "$CS"

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop web app
        if: always()
        run: |
          if [ -n "${APP_PID}" ]; then
            kill "${APP_PID}" 2>/dev/null || true
          fi
