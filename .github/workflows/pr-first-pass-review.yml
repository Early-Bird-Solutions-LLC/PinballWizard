name: PR first-pass review

# Claude Code CI Propose agent (ADR-0069 / ADR-0066 / ADR-0051).
# First-pass review of the PR *diff* — complementary to pr-feedback-triage.yml
# (ADR-0041), which classifies *reviewer* feedback.
#
# Comment-only: contents:read, no Edit/Write/git push, never approve/request-changes.
# Enablement: repository variable ENABLE_PR_FIRST_PASS_REVIEW must be the string
# "true". Default is off (AGENT-08 adversary gate).
#
# Security (Bugbot / ADR-0069):
#  - Checkout is the PR *base* SHA only (not the merge commit) so CLAUDE.md /
#    .claude from the head never land in the action cwd.
#  - Prompt is copied from that trusted base tree into /tmp and injected as
#    action input — never loaded from head (a same-repo PR must not rewrite
#    its own reviewer instructions). Random GITHUB_OUTPUT delimiter.
#  - Run skeleton is written before prompt load so failure paths never hit a
#    missing artifact JSON.
#  - No actions:write (artifact upload works with contents:read; write would
#    allow workflow_dispatch via gh api).
#  - Bot-authored PRs are skipped (neutral) so Renovate/docs-agent do not
#    hard-fail on allowed_bots defaults.
#
# NOTE: Prefer merging this workflow to main before flipping the enablement variable.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: pr-first-pass-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  first-pass-review:
    runs-on: ubuntu-latest
    if: >-
      vars.ENABLE_PR_FIRST_PASS_REVIEW == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Checkout PR base only (never head / merge commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Write run skeleton (outcome slots)
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > artifacts/pr-first-pass-review-run.json <<EOF
          {
            "agent": "pr-first-pass-review",
            "prompt_version": "v1.2026.11",
            "adr": "0069",
            "trust_tier": "Propose",
            "category": "claude-code-ci",
            "repo": "${{ github.repository }}",
            "pr_number": ${{ github.event.pull_request.number }},
            "head_sha": "${{ github.event.pull_request.head.sha }}",
            "base_sha": "${{ github.event.pull_request.base.sha }}",
            "status": "started",
            "outcome": {
              "rating": null,
              "rated_by": null,
              "rated_at": null,
              "notes": null
            },
            "kit_status": "transitional",
            "kit_expires": "2026-12-31"
          }
          EOF

      - name: Load versioned prompt from trusted base tree into /tmp
        id: agent_prompt
        env:
          PROMPT_PATH: .github/agents/pr-first-pass-review.md
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Prompt must come from the checked-out base tree (already merged /
          # trusted). Never fetch the head blob — a same-repo PR could rewrite
          # reviewer instructions in the same diff under review.
          if [[ ! -f "${PROMPT_PATH}" ]]; then
            echo "::error::Trusted prompt missing on base ${BASE_SHA}: ${PROMPT_PATH}"
            exit 1
          fi
          cp "${PROMPT_PATH}" /tmp/pr-first-pass-review.md
          # Random delimiter so a literal PROMPT_EOF line cannot truncate outputs.
          delim="PROMPT_$(openssl rand -hex 16)"
          {
            echo "text<<${delim}"
            cat /tmp/pr-first-pass-review.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: First-pass review (comment only)
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Human-authored same-repo PRs only (Bot skipped in job if). Do not
          # set allowed_bots='*' on this public repo.
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            BASE_SHA: ${{ github.event.pull_request.base.sha }}

            Working tree is the PR *base* commit only. Review the PR via gh —
            do not assume cwd contains the head diff.

            Follow the agent instructions below exactly.

            ${{ steps.agent_prompt.outputs.text }}
          claude_args: |
            --max-turns 12
            --model claude-sonnet-4-6
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(gh pr comment:*)"

      - name: Mark run completed (best-effort)
        if: success()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("artifacts/pr-first-pass-review-run.json")
          data = json.loads(p.read_text())
          data["status"] = "completed"
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Mark run failed (best-effort)
        if: failure()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("artifacts/pr-first-pass-review-run.json")
          if not p.is_file():
              raise SystemExit(
                  "run skeleton missing — checkout or Write run skeleton step failed before prompt load"
              )
          data = json.loads(p.read_text())
          data["status"] = "failed"
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-first-pass-review-run-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: artifacts/pr-first-pass-review-run.json
          retention-days: 90
          if-no-files-found: warn
